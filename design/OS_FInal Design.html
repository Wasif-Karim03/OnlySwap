.wdoc nav a{display:block;font-size:15px;color:var(--ink2);font-weight:550;padding:9px 12px;border-radius:10px}
.wdoc nav a.on{background:var(--bg2);color:var(--ink);font-weight:700}
.wdoc h1{font-size:44px;font-weight:800;letter-spacing:-.045em;line-height:1.05}
.wdoc h3{font-size:20px;font-weight:750;letter-spacing:-.02em;margin-top:30px}
.wdoc p{font-size:16px;line-height:1.65;color:var(--ink2);margin-top:8px;max-width:680px}
.faq{border-bottom:1px solid var(--line);padding:18px 0;display:flex;align-items:center;gap:12px;font-size:17px;font-weight:650}
.wordl{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.wordl span{background:var(--bg2);border-radius:9px;padding:6px 10px;font-size:13.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.push{background:rgba(245,245,245,.9);border-radius:20px;padding:12px 14px;display:flex;gap:11px;color:#111;box-shadow:0 10px 30px -12px rgba(0,0,0,.25)}
</style>
<script>
const withSheet=(h,sheet)=>h.replace(/<\/div>$/,`<div class="scrim"></div><div class="sh"><div class="grab"></div>${sheet}</div></div>`);
const LST=()=>S.find(s=>s.sec==='B'&&s.name==='Listing').html;

/* ===== 1. report a listing ===== */
addAfter('B','On hold','Listing options','The "more" button on any listing. Reporting sits last and in red so nobody taps it by accident, but it\'s always one tap away.',
withSheet(LST(),`<div class="asht">${[['share','Share listing'],['eye','Not interested','Hides this and similar items'],['user','See Devin\'s profile']].map(([i,t,s])=>`<div>${ic(i,20)}<span style="flex:1">${t}${s?`<span class="mi" style="display:block;margin:2px 0 0;font-weight:500">${s}</span>`:''}</span></div>`).join('')}</div>
<div class="asht"><div style="color:var(--red)">${ic('flag',20)}<span>Report listing</span></div></div><div class="btn s" style="margin-top:12px;background:var(--bg2)">Cancel</div>`));

addAfter('B','Listing options','Report listing','Reasons match the banned items list and the scams that actually happen. Seller never finds out who reported.',
withSheet(LST(),`<div class="hs">Report this listing</div><div class="s" style="margin-top:4px">Reports are private. Devin won't know it was you.</div>
<div class="opts" style="margin-top:14px">${[['Looks like a scam',0],["It's not allowed (vapes, alcohol, weapons…)",0],['Might be stolen',1],['Fake or counterfeit',0],['Wrong photos or misleading',0],['Something else',0]].map(([t,o])=>`<div class="op ${o?'on':''}" style="padding:11px 14px"><span class="rdo ${o?'on':''}"></span><span class="t" style="font-size:15px">${t}</span></div>`).join('')}</div>
<div class="in ta" style="margin-top:10px;min-height:64px;color:var(--ink3);font-size:14.5px">Add details (optional). Example: my bike was stolen from Morrill last week</div>
<div class="btn k" style="margin-top:12px">Send report</div>`));

/* ===== 2. appeal form ===== */
addAfter('X','Suspended','Appeal','What "Appeal this" opens. It shows exactly what was removed and why, then one box for their side. A real person answers, usually within two days.',
`<div class="scr">${sb()}${nav('x','Appeal')}<div class="ct">
<div class="card" style="margin-top:8px"><div class="mi" style="margin:0">Removed Sep 23 · Banned items rule</div><div style="display:flex;gap:10px;align-items:center;margin-top:10px">${thumb('pods',48,10)}<div><div class="t" style="font-size:14.5px">Vape pen, barely used</div><div class="s" style="font-size:12.5px">Your listing · $15</div></div></div></div>
<div class="lbl" style="margin-top:18px">What happened?</div><div class="opts" style="margin-top:8px">${[['This was a mistake',1],['I didn\'t know the rule',0],['Someone else used my account',0]].map(([t,o])=>`<div class="op ${o?'on':''}" style="padding:11px 14px"><span class="rdo ${o?'on':''}"></span><span class="t" style="font-size:15px">${t}</span></div>`).join('')}</div>
<div class="lbl" style="margin-top:16px">Tell us your side</div><div class="in ta f" style="min-height:96px">It's an empty case from a portable charger kit, not a vape. I can send another photo.<span class="caret" style="height:18px;margin-left:2px"></span></div>
<div class="mi" style="text-align:right">86/500</div>
<div class="hint" style="margin-top:6px">${ic('info',16)}<span>One appeal per decision. A person reviews it, usually within 48 hours, and you'll get a notification either way.</span></div></div>
${dock(`<div class="btn k">Send appeal</div>`)}</div>`);

/* ===== 3. web: legal, support, delete ===== */
const wnav=`<div class="lnav">${WL()}<a style="margin-left:24px">How it works</a><a>Safety</a><a>Campuses</a><div style="margin-left:auto" class="wbtn k">Get the app</div></div>`;
add('W','Privacy policy · web','The public Privacy page. Apple and Google both need a link to this before the app can go live. Same short-table-first layout as in the app, with Terms, rules and safety one click away.',
wf('onlyswap.app/privacy',`${wnav}<div class="wdoc"><nav>${['Privacy policy','Terms of service','Community rules','Banned items','Safety','Cookies'].map((t,i)=>`<a class="${i?'':'on'}">${t}</a>`).join('')}</nav>
<div><div class="mi">Last updated September 1, 2026</div><h1 style="margin-top:8px">Privacy policy</h1><p>The short version: we collect what we need to run a marketplace for students, we never sell it, and you can delete it any time.</p>
<table class="htb" style="max-width:760px;margin-top:22px"><tr><th>What</th><th>Why</th><th>How long</th></tr>${[['School email','Check you\'re a student','Until you delete your account'],['Listings and photos','Show your stuff to buyers','Until you delete them'],['Messages','Deliver chats, handle reports','Deleted with your account'],['Rough location, only while picking a meetup','Suggest nearby safe spots','Never stored'],['Reports','Keep people safe','180 days after closing']].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>
<h3>We never sell your data</h3><p>No ads, no data brokers, no tracking across other apps. We only read messages when one is reported to us.</p>
<h3>Your choices</h3><p>Download a copy of your data or delete your account from Settings in the app, or from <b style="color:var(--ink)">onlyswap.app/delete</b>.</p></div></div>`),{w:1});

add('W','Support · web','The support link the stores require. Answers the common questions first, then a form that goes straight to your inbox. Safety issues get their own path at the top.',
wf('onlyswap.app/help',`${wnav}<div style="padding:56px 0 80px;display:flex;justify-content:center"><div style="width:760px">
<h1 class="lh2" style="font-size:48px">How can we help?</h1>
<div class="in" style="margin-top:22px;height:56px;font-size:17px;border-radius:16px">${ic('search',20,'mu')}<span style="color:var(--ink3)">Search help</span></div>
<div class="card" style="margin-top:18px;display:flex;gap:12px;align-items:center;background:var(--redbg)">${ic('shield',22)}<div style="flex:1"><div class="t">Something unsafe happened?</div><div class="s">If you're in danger, call 911 first. Then report it here and a person will look at it today.</div></div><div class="wbtn k">Report a safety issue</div></div>
<div style="margin-top:22px">${['My code never arrived','My school isn\'t listed','How do I pay or get paid?','Someone didn\'t show up to a meetup','How do I delete my account?','I got banned. Can I appeal?'].map(q=>`<div class="faq"><span style="flex:1">${q}</span>${ic('chev',18,'mu')}</div>`).join('')}</div>
<div class="card" style="margin-top:28px"><div class="t" style="font-size:17px">Still stuck?</div><div class="s">Write to us. We usually reply within a day.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px"><div class="in" style="background:var(--bg)"><span style="color:var(--ink3)">Your school email</span></div><div class="in" style="background:var(--bg)"><span style="flex:1;color:var(--ink3)">Topic</span>${ic('down',16,'mu')}</div></div><div class="in ta" style="background:var(--bg);margin-top:10px;min-height:90px;color:var(--ink3)">What's going on?</div><div class="wbtn p" style="margin-top:12px">Send</div></div></div></div>`),{w:1});

add('W','Delete account · web','Google requires a way to delete your account from the web, not just the app. Sign in with the school email code, see what goes away, confirm.',
wf('onlyswap.app/delete',`${wnav}<div style="height:724px;display:flex;align-items:center;justify-content:center;background:var(--bg2)"><div style="width:520px;background:var(--bg);border-radius:24px;padding:40px">
<div class="hm">Delete your OnlySwap account</div><p class="bd" style="margin-top:8px">Signed in as wkarim.12@osu.edu</p>
<div class="dl" style="margin-top:16px">${['Your 3 active listings come down','Open offers are cancelled','Your chats are deleted on your side','Ratings you gave stay up, without your name'].map(x=>`<div>${ic('x',16,'b')}<span>${x}</span></div>`).join('')}</div>
<p class="mi" style="margin-top:14px;line-height:1.5">Safety records are kept for 180 days, then deleted. You'll get an email when it's done.</p>
<div class="lbl" style="margin-top:18px">Type DELETE to confirm</div><div class="in f">DELETE<span class="caret" style="margin-left:-8px"></span></div>
<div class="btn dr" style="margin-top:14px">Delete my account</div></div></div>`),{w:1});

/* ===== 4. location ===== */
addAfter('X','Camera access','Location access','Asked only when someone picks a meetup spot, never at launch. Rough location is enough, and the screen says so.',
`<div class="scr">${sb()}${nav('x')}<div class="ct stc"><div class="emptyart" style="background:var(--acc);color:var(--onacc)">${ic('pin',40)}</div>
<div class="hl" style="margin-top:22px">Find safe spots near you</div><p class="bd" style="margin-top:8px;max-width:290px">We use your rough location to sort meetup spots by distance. It's never shown to anyone and never saved.</p>
<div class="card" style="margin-top:20px;text-align:left;width:100%"><div class="tips">${['Only while you\'re picking a spot','Approximate is fine, precise isn\'t needed','You can still pick from the list without it'].map(t=>`<div style="font-size:14px">${ic('check',15,'b')}<span>${t}</span></div>`).join('')}</div></div></div>
${dock(`<div class="btn p">Continue</div><div class="btn t" style="margin-top:2px">Not now</div>`)}</div>`);

addAfter('X','Location access','Location off','If they say no, nothing breaks. Spots show in a plain list, safe-exchange zones first, with a small banner to turn it on later.',
`<div class="scr">${sb()}${nav('back','Pick a spot')}<div class="ct">
<div class="card" style="margin-top:6px;display:flex;gap:10px;align-items:center;padding:12px 14px">${ic('pin',18,'mu')}<span class="s" style="flex:1;font-size:13.5px">Location is off, so spots aren't sorted by distance.</span><span class="sm" style="font-weight:700;color:var(--ink)">Turn on</span></div>
<div class="lbl" style="margin-top:16px">Safe-exchange zones</div><div class="opts" style="margin-top:8px">${[['RPAC safe-exchange zone','Cameras · lit · 24/7',1],['Ohio Union front desk','Staffed until midnight',0],['Campus police lobby','Open 24/7',0]].map(([t,s,o])=>`<div class="op ${o?'on':''}"><span class="rdo ${o?'on':''}"></span><div style="flex:1"><div class="t" style="font-size:15px">${t}</div><div class="s" style="font-size:12.5px">${s}</div></div><span class="tag ac">Safe zone</span></div>`).join('')}</div>
<div class="lbl" style="margin-top:16px">Other public spots</div><div class="opts" style="margin-top:8px">${[['Thompson Library entrance','Busy during the day'],['18th Ave Library lobby','Open until 2 AM']].map(([t,s])=>`<div class="op"><span class="rdo"></span><div style="flex:1"><div class="t" style="font-size:15px">${t}</div><div class="s" style="font-size:12.5px">${s}</div></div></div>`).join('')}</div></div>
${dock(`<div class="btn k">Suggest RPAC to Aisha</div>`)}</div>`);

/* ===== 5. sell errors ===== */
addAfter('D','Sell · details','Sell · fix these','What happens when Next is tapped with problems. Every issue shows at once, next to its field, and the banned-word check explains the rule instead of just blocking.',
`<div class="scr">${sb()}${nav('back','New listing',stepR('2 of 3'))}<div class="pgb"><i class="on"></i><i class="on"></i><i></i></div>
<div class="ct" style="padding-top:14px"><div class="ebanner">${ic('alert',18)}<span><b>3 things to fix</b> before you can post</span></div>
<div class="lbl" style="margin-top:14px">Title</div><div class="in e2">Vape + charger bundle</div><div class="ferr">${ic('info',14)}<span>Vapes aren't allowed on OnlySwap. <u>See banned items</u></span></div>
<div class="lbl" style="margin-top:14px">Category</div><div class="in e2"><span style="flex:1;color:var(--ink3)">Pick a category</span>${ic('chev',18,'mu')}</div><div class="ferr">${ic('info',14)}<span>Pick one so the right people see it</span></div>
<div class="lbl" style="margin-top:14px">Condition</div><div class="sg"><div>New</div><div class="on">Like new</div><div>Good</div><div>Fair</div></div>
<div class="lbl" style="margin-top:14px">Price</div><div class="in e2"><b>$4,500</b></div><div class="ferr">${ic('info',14)}<span>Prices go up to $2,000. For anything more, meet somewhere staffed and bring a friend.</span></div>
<div class="rw" style="margin:14px 0 0"><span class="t">Open to offers</span><span class="tg on"></span></div></div>
${dock(`<div class="btn p dis">Next</div>`)}</div>`);

/* ===== 6. offer limit ===== */
addAfter('B','Make an offer','Offer limit','Hit only by spammers or very keen shoppers. It says when they can offer again and points to Saved, so a real buyer doesn\'t feel punished.',
withSheet(S.find(s=>s.sec==='B'&&s.name==='Swipe').html,`<div class="stc" style="padding:10px 0 4px"><div class="emptyart">${ic('clock',36)}</div><div class="hm" style="margin-top:16px">That's 10 offers this hour</div>
<p class="bd" style="margin-top:6px;max-width:300px">To keep things fair for sellers, you can make more at <b style="color:var(--ink)">10:41 AM</b>. Anything you swipe right on until then gets saved for you.</p></div>
<div class="btn k" style="margin-top:14px">Got it</div><div class="btn t" style="margin-top:2px">See your open offers</div>`));

/* ===== 7. school not found ===== */
addAfter('A','School email','School not found','When the email domain isn\'t on the campus list. It offers the likely fix (a typo or a different address), then the waitlist, so nobody hits a dead end.',
`<div class="scr">${sb()}${nav('back')}
<div class="ct"><div class="hl" style="margin-top:8px">What's your school email?</div>
<div class="in e2" style="margin-top:24px">${ic('mail',20,'mu')}<span>jlee4@wittenberg.edu</span></div>
<div class="card" style="margin-top:14px"><div class="t" style="font-size:15px">We don't know this school yet</div><div class="s" style="margin-top:4px">OnlySwap opens one campus at a time. Does your school use a different email, like one for students?</div>
<div class="grp" style="margin-top:12px;background:var(--bg)"><div class="li"><span class="t" style="flex:1;font-size:15px">Try a different email</span>${ic('chev',16,'mu')}</div><div class="li" style="border:0"><span style="flex:1"><span class="t" style="font-size:15px;display:block">Get Wittenberg on the list</span><span class="s" style="font-size:12.5px">Opens once 500 students join</span></span>${ic('chev',16,'mu')}</div></div></div>
<p class="mi" style="margin-top:14px;line-height:1.5">Personal emails like Gmail can't be used. Only school addresses prove you're a student.</p></div>
${dock(`<div class="btn p">Join the waitlist</div>`)}</div>`);

/* ===== 8. emails ===== */
function email(subj,to,time,body){return `<div class="scr" style="background:#fff;color:#111">${sb()}<div class="nv" style="color:#007AFF;font-size:17px"><span style="display:flex;align-items:center;margin-left:-6px">${ic('back',24)} Inbox</span></div>
<div class="ct" style="--line:#E6E6E6;--ink2:#6b6b6b;--ink3:#8e8e93;--ink:#111;--bg:#fff"><div style="display:flex;gap:10px;align-items:center;margin-top:6px">${mark(40,'var(--acc)','var(--onacc)')}<div style="flex:1"><div class="t" style="font-size:15px">OnlySwap</div><div class="s" style="font-size:13px">to me · ${time}</div></div></div>
<div class="hm" style="margin-top:14px;font-size:21px">${subj}</div><div class="mailc"><div style="display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;letter-spacing:-.05em">${mark(26,'var(--acc)','var(--onacc)')}onlyswap</div>${body}
<p style="font-size:12px;line-height:1.5;color:#999;margin-top:22px;border-top:1px solid #eee;padding-top:14px">OnlySwap · sent to ${to}. Not affiliated with any university.</p></div></div></div>`}
const EP=(t,s='')=>`<p style="font-size:15px;line-height:1.55;margin-top:14px;${s}">${t}</p>`;
add('T','Email · campus open','Sent to everyone on the waitlist the moment their school hits 500. The one email that should feel exciting, so it leads with the number and gets out of the way.',
email('Michigan is open on OnlySwap','jlee@umich.edu','8:02 AM',`<div style="font-size:44px;font-weight:800;letter-spacing:-.05em;margin-top:18px;line-height:1">500 students.</div>${EP('That\'s the number Michigan needed, and you helped get there. Listings are already going up, and founding sellers get a badge for the first two weeks.')}<div class="btn p" style="margin-top:18px">Open OnlySwap</div>${EP('Your spot was number 213. Thanks for waiting.','font-size:13.5px;color:#6b6b6b')}`));
add('T','Email · account paused','Short, specific and not scary. The same facts as the in-app screen, so someone who deleted the app still knows what happened.',
email('Your OnlySwap account is paused until Oct 2','wkarim.12@osu.edu','3:04 PM',`${EP('One of your listings broke the banned items rule (vapes), so your account is paused until <b>Oct 2 at 9:00 AM</b>.')}${EP('You can still read and finish chats you already had open. You can\'t list, offer or post until then.')}<div class="btn k" style="margin-top:18px">Appeal this</div>${EP('If you think we got it wrong, appeals are read by a person, usually within 48 hours.','font-size:13.5px;color:#6b6b6b')}`));
add('T','Email · re-verify','Once a year, to keep the marketplace students-only. Two weeks of warning, then a reminder, then listings pause until it\'s done.',
email('Still at Ohio State? Confirm in 10 seconds','wkarim.12@osu.edu','9:15 AM',`${EP('Once a year we check everyone is still a student, so OnlySwap stays students-only.')}<div class="card" style="margin-top:16px;background:#f5f5f3"><div class="t">Confirm by Sep 30</div><div class="s">After that your listings pause until you do.</div></div><div class="btn p" style="margin-top:18px">Confirm I'm still a student</div>${EP('Graduated? Congrats. You can delete your account or keep it until your school email stops working.','font-size:13.5px;color:#6b6b6b')}`));
add('T','Email · account deleted','The last one. Confirms what was deleted and when, which people often need as proof, and leaves the door open without begging.',
email('Your OnlySwap account is deleted','wkarim.12@osu.edu','11:40 AM',`${EP('Done. Your account, listings, offers and your side of every chat are gone as of <b>Sep 25, 2026 at 11:38 AM</b>.')}${EP('Safety reports involving your account are kept for 180 days, then deleted too.')}${EP('Didn\'t ask for this? Reply to this email today and we\'ll look into it.','font-size:13.5px;color:#6b6b6b')}`));

/* ===== 9. Play screenshots ===== */
add('T','Play Store screenshots','Same five ideas as the App Store set, on the Android screens, because Google shows the real device frame and people notice when it\'s an iPhone.',
`<div class="th shots">${[['Swipe what\'s for sale on your campus','N','Android · Discover'],['See it, ask, make an offer','N','Android · listing'],['Chat once they say yes','N','Android · chat'],['Say it anonymously on the Quad','N','Android · Quad'],['Only verified students. No randoms.','A','School email']].map(([c,s,n])=>`<div class="shot"><h5>${c}</h5>${phmini(s,n,.53)}</div>`).join('')}</div>`,{w:1});

/* ===== 10. photos in chat ===== */
addAfter('E','Chat','Photos in chat','Optional, your call. If you allow photos, they\'re for item details only. Photos from someone new arrive blurred until tapped, which blocks the worst surprises without reading anyone\'s messages.',
`<div class="scr">${chat(`<div class="sys">You accepted Aisha's $50 offer · 2:14 PM</div><div class="m th">does it have any scratches on the screen?</div><div class="m me">nope, here's a close up</div>
<div class="phm" style="${I('mon',500)};background-size:cover;background-position:center"></div>
<div class="m th">and the back?</div><div class="phm th" style="${I('mon2',500)};background-size:cover"><div class="bl">${ic('eye',22)}<span>Photo from Aisha</span><span style="font-weight:500;opacity:.85">Tap to show</span></div></div>`).replace('<div class="ib f">'+ic('plus',22)+'</div>','<div class="ib f">'+ic('camera',21)+'</div>')}</div>`);

/* ===== 11. admin extras ===== */
add('G','Admin · team','When you bring on help, like a campus ambassador, they get only what the job needs. Moderators can handle reports on their campus but never reveal an anonymous account.',
desk('Settings','settings/team',`<div class="mh"><h1>Team</h1><div class="btn k" style="width:auto;padding:0 16px;height:38px;font-size:14px;border-radius:10px">${ic('plus',16)} Invite someone</div></div>
<div style="display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px">
<div class="pn" style="padding:4px 8px"><table class="tb2"><tr><th>Person</th><th>Role</th><th>Campus</th><th>2-step</th><th>Last active</th></tr>
${[['W','Wasif K.','Owner','All','On','now'],['M','Maya R.','Moderator','Ohio State','On','2h'],['J','Jess M.','Moderator','Ohio State','Pending','Invited Sep 24']].map(([i,n,r,c,t,l])=>`<tr><td><span style="display:flex;gap:8px;align-items:center">${av(i,AVC[i],28)}<b style="font-weight:650">${n}</b></span></td><td>${r}</td><td>${c}</td><td><span class="tag ${t==='On'?'gn':'am'}">${t}</span></td><td style="color:var(--ink3)">${l}</td></tr>`).join('')}</table></div>
<div class="pn"><h3>What each role can do</h3><table class="tb2"><tr><th></th><th>Owner</th><th>Moderator</th></tr>${[['Review reports and appeals','✓','✓'],['Remove listings and posts','✓','✓'],['Suspend for up to 7 days','✓','✓'],['Ban accounts','✓',''],['Reveal an anonymous account','✓',''],['Read reported chats','✓','✓'],['Campus settings, team, metrics','✓','']].map(([a,b,c])=>`<tr><td>${a}</td><td style="text-align:center">${b}</td><td style="text-align:center">${c||'<span style="color:var(--ink3)">·</span>'}</td></tr>`).join('')}</table><div class="mi" style="margin-top:10px">Everything a moderator does lands in the audit log.</div></div></div>`),{w:1});

add('G','Admin · announcement','For the rare message that should reach everyone on a campus: a safe-spot change, a scam going around, move-out week. Limited to one a week so it never turns into marketing.',
desk('Campuses','campuses/osu/announce',`<div class="mh"><h1>New announcement</h1><div class="dd">Ohio State · 1,284 students ${ic('down',14)}</div></div>
<div style="display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px">
<div class="pn"><div class="lbl">Type</div><div class="sg" style="width:100%"><div class="on">Safety</div><div>Campus news</div><div>Update</div></div>
<div class="lbl" style="margin-top:14px">Title</div><div class="in">Heads up: fake payment screenshots</div>

${[['vape, juul, disposable','Listings','Block','23','0'],['fake id','Everywhere','Block','2','0'],['zelle only, cash app first','Chats (on report)','Review','9','1'],['adderall, addy','Everywhere','Block','6','0'],['essay, do your homework','Listings','Review','14','5',1],['parking pass','Listings','Review','11','8',1],['beer, alcohol','Listings','Block','4','0']].map(([w,p,a,f,o,hl])=>`<tr><td style="font-weight:650">${w}</td><td>${p}</td><td><span class="tag ${a==='Block'?'rd':'am'}">${a}</span></td><td>${f}</td><td style="${hl?'color:var(--amber);font-weight:700':''}">${o}${hl?' · check this':''}</td><td>${ic('edit',16,'mu')}</td></tr>`).join('')}</table></div>
<div class="mi" style="margin-top:10px">Chats are only checked when someone reports them. Nobody's private messages are scanned.</div>`),{w:1});

(function(){const s=S.find(x=>x.sec==='F'&&x.name==='Settings');let h=s.html;const i=h.indexOf('>Notifications</div>');const st=h.lastIndexOf('<div class="lbl"',i);const en=h.indexOf('<div class="lbl"',i+5);

h=h.replace('<div class="grp" style="margin-top:16px"><div class="li">','<div class="grp" style="margin-top:16px"><div class="li"><span class="t" style="flex:1;font-size:15px">Download your data</span>'+ic('chev',16,'mu')+'</div><div class="li"><span class="t" style="flex:1;font-size:15px">About OnlySwap</span><span class="s">1.0.4</span>'+ic('chev',16,'mu')+'</div><div class="li">');s.html=h})();

`<div class="scr">${sb()}${nav('back','Your data')}<div class="ct"><div class="hl" style="margin-top:6px">Get a copy of your data</div><p class="bd" style="margin-top:8px">We'll put it in one file and email a download link to wkarim.12@osu.edu. It usually takes a few minutes, at most 48 hours.</p>
<div class="lbl" style="margin-top:18px">What's included</div><div class="tips" style="margin-top:8px">${['Your profile and school email','Every listing, with photos','Offers you made and got','Your messages','Ratings you gave and got','Quad posts and replies (only you can see they\'re yours)'].map(t=>`<div style="font-size:14.5px">${ic('check',15,'b')}<span>${t}</span></div>`).join('')}</div>

${grpS('',[['Terms of service',''],['Privacy policy',''],['Community rules',''],['Open-source licenses','']])}

<p class="mi" style="text-align:center;margin-top:22px;line-height:1.5">Made by a student in Ohio.<br>Not affiliated with or endorsed by any university.</p></div></div>`);

['Extras',[['Photos in chat','Optional, blurred until tapped','E'],['Admin team and roles','Moderators with limits','G'],['Campus announcement','One a week, max','G'],['Banned words','With false-alarm tracking','G'],['Download your data','From Settings','F'],['About','Version, legal, licenses','F']]]];
add('K','Third audit','The last sweep: buttons that pointed nowhere, pages the stores ask for, and the extras. All designed.',
`<div class="th ck">${CK3.map(([h,items])=>`<div><h4>${h} · ${items.length}/${items.length} done</h4>${items.map(([t,s,sec])=>`<div class="cki"><span class="bx">${ic('check',15,'b')}</span><div style="flex:1"><b>${t}</b><span>${s}</span></div><span class="tag gy">${sec}</span></div>`).join('')}</div>`).join('')}</div>`,{w:1});

<script>
/* ===== widgets ===== */
add('X','Home screen widgets','Optional, after launch. A medium widget shows what\'s new on campus, a small one counts down to your next meetup. Both open straight to the right screen.',
`<div class="home">${sb()}<div style="padding:14px 18px 0;display:grid;grid-template-columns:1fr;gap:14px">
<div class="wg"><div style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700">${mark(20,'var(--acc)','var(--onacc)')}New at Ohio State<span style="margin-left:auto;color:#888;font-weight:500">12 today</span></div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px">${[['fridge','$40','Mini fridge'],['bike','$120','Trek bike'],['chair','$30','Desk chair']].map(([k,p,t])=>`<div><div style="height:74px;border-radius:12px;${I(k,300)};background-size:cover;background-position:center"></div><div style="font-size:13px;font-weight:800;margin-top:5px">${p}</div><div style="font-size:11.5px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t}</div></div>`).join('')}</div></div>

<div class="wg" style="height:150px;display:flex;flex-direction:column"><div style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#666">${mark(18,'var(--acc)','var(--onacc)')}Selling</div><div style="font-size:34px;font-weight:800;letter-spacing:-.04em;margin-top:auto">2</div><div style="font-size:13px;font-weight:650">new offers</div><div style="font-size:11.5px;color:#888">on your monitor</div></div></div></div>
<div class="apps" style="margin-top:22px">${['Messages','Calendar','Photos','Camera','Maps','Canvas','Spotify','Notes'].map(n=>`<div><i></i>${n}</div>`).join('')}</div></div>`,{hi:'l'});

add('X','Lock screen widgets','Small circles under the clock: meetup time and unread offers. Glanceable enough that people check them instead of opening the app.',
`<div class="lock">${sb()}<div class="lclock"><div class="d">Friday, September 25</div><div class="t2">9:41</div></div>
<div style="display:flex;gap:14px;justify-content:center;margin-top:10px"><div class="lwg"><span style="font-size:10px;opacity:.8">MEET</span><span style="font-size:17px">4:30</span></div><div class="lwg"><span style="font-size:10px;opacity:.8">OFFERS</span><span style="font-size:20px">2</span></div>
<div style="height:72px;border-radius:20px;background:rgba(255,255,255,.18);backdrop-filter:blur(12px);padding:10px 14px;display:flex;flex-direction:column;justify-content:center;width:150px"><span style="font-size:11px;opacity:.8;font-weight:600">Next meetup</span><b style="font-size:15px">Aisha · RPAC</b><span style="font-size:12px;opacity:.8">in 4 hr 49 min</span></div></div>

/* ===== iPad ===== */
const iside=a=>`<aside><div style="display:flex;align-items:center;gap:8px;font-size:21px;font-weight:800;letter-spacing:-.05em;padding:0 10px 20px">${mark(30,'var(--acc)','var(--onacc)')}onlyswap</div>${[['cards','Discover'],['quad','Quad'],['plussq','Sell'],['chat','Inbox'],['user','Profile']].map(([i,l])=>`<div class="an ${l===a?'on':''}">${ic(i,20)}${l}</div>`).join('')}<div class="card" style="margin-top:22px;background:var(--bg);padding:12px"><div class="mi" style="margin:0">Ohio State</div><div class="t" style="font-size:14px">1,284 students</div></div></aside>`;

`<div class="th ipad">${iside('Discover')}<div style="padding:26px 30px;overflow:hidden"><div style="display:flex;align-items:center;gap:12px"><div class="hl" style="margin:0">What's new</div><div class="in" style="margin-left:auto;width:320px;height:42px;font-size:15px">${ic('search',18,'mu')}<span style="color:var(--ink3)">Search Ohio State</span></div></div>
<div class="chips" style="margin-top:14px">${['All','Furniture','Tech','Textbooks','Kitchen','Free'].map((c,i)=>`<span class="ch ${i?'':'on'}">${c}</span>`).join('')}</div>
<div class="igrid" style="margin-top:18px">${[['fridge','$40','Mini fridge, 3.1 cu ft','Baker Hall'],['bike','$120','Trek city bike','Morrill'],['chair','$30','Desk chair','Lincoln'],['mon','$60','Dell 24" monitor','Park-Stradley'],['books','$25','CHEM 1210 books','Thompson'],['lamp','$12','Desk lamp','Taylor']].map(([k,p,t,w])=>`<div class="c"><div class="p" style="${I(k,500)}"></div><div style="display:flex;gap:8px;align-items:baseline;margin-top:8px"><b style="font-size:18px;font-weight:800">${p}</b><span class="t" style="font-size:14.5px">${t}</span></div><div class="mi" style="margin:2px 0 0">${w} · 1h ago</div></div>`).join('')}</div></div></div>`,{w:1});

add('N','iPad · inbox','Two panes, the way Messages works on iPad: conversations on the left, the chat and meetup card on the right.',
`<div class="th ipad">${iside('Inbox')}<div style="display:grid;grid-template-columns:330px 1fr;height:820px"><div style="border-right:1px solid var(--line);padding:26px 16px"><div class="hl" style="margin:0 0 14px 6px">Inbox</div>
${[['A','Aisha K.','Dell monitor · meetup 4:30',1],['L','Leo M.','Trek bike · can you do $95?'],['G','Grace T.','Textbooks · thanks!'],['D','Devin P.','Mini fridge · offer accepted']].map(([i,n,s,on])=>`<div style="display:flex;gap:10px;align-items:center;padding:12px 10px;border-radius:14px;${on?'background:var(--bg2)':''}">${av(i,AVC[i],42)}<div style="flex:1;min-width:0"><div class="t" style="font-size:15px">${n}</div><div class="s" style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s}</div></div></div>`).join('')}</div>
<div class="scr" style="position:relative;height:820px">${chat(CHAT_A).replace(sb(),"<div style=\"height:18px\"></div>")}</div></div></div>`,{w:1});

/* ===== languages ===== */

S.find(s=>s.sec==='B'&&s.name==='Swipe').html.split('>Discover<').join('>Descubrir<').split('>Sell<').join('>Vender<').split('>Inbox<').join('>Mensajes<').split('>Profile<').join('>Perfil<').split('>Swipe<').join('>Deslizar<').split('3 people saved this').join('3 personas lo guardaron').split('Good condition').join('Buen estado').split('12m ago').join('hace 12 min').split('swaps').join('intercambios').split('Mini fridge, 3.1 cu ft').join('Minirefrigerador, 88 L'));

add('H','Languages','What has to be true before a second language: no text baked into images, room for longer words, and dates, prices and plurals formatted by the phone, not by hand.',
`<div class="th ho"><h3>Languages and regions</h3><p class="sub">Launch in English. Spanish is the likely second, given how many US students use it daily.</p>

`<div class="th storyb"><h3 style="font-size:22px;font-weight:800;letter-spacing:-.03em">App preview · 25 seconds · no voice-over</h3><p class="sub" style="font-size:14.5px;color:var(--ink2);margin-top:4px">Captions sit in the top third so they don't cover the action. Music is optional, the story works muted.</p>

<div class="bx2"><h4>1 · Accent color</h4><div class="sub">Tap one and the whole file changes. The pick becomes <code>--acc</code> in the code.</div><div class="csw">${THM.map(([k,c,n])=>`<button onclick="document.querySelector('#theme button[data-t=${k}]').click()"><i style="background:${c}"></i>${n}</button>`).join('')}</div></div>
<div class="bx2"><h4>2 · Logo</h4><div class="sub">Tap to swap it everywhere, including the icon sheet and store assets.</div><div class="lgb">${LOGOC.map(([k,n])=>`<button onclick="setLogo('${k}')"><span><svg viewBox="0 0 100 100" style="--cut:var(--acc)">${LOGO[k]}</svg></span>${n}</button>`).join('')}</div></div>
<div class="bx2"><h4>3 · Photos in chat</h4><div class="sub">Helps buyers check condition, adds some moderation risk.</div><div class="ch2"><span class="rec">Yes, blurred from new people<small>Designed (E · Photos in chat)</small></span><span>No photos at launch<small>Composer keeps the calendar only</small></span></div></div>
<div class="bx2"><h4>4 · Age policy</h4><div class="sub">Some first-years are 17. Affects the store age rating and privacy law exposure. Worth a quick word with a lawyer.</div><div class="ch2"><span>18+ with a birthday step<small>Adds one sign-up screen</small></span><span>Students only, no age check<small>Current design</small></span></div></div>
<div class="bx2"><h4>5 · Devices at launch</h4><div class="sub">iPad and Android layouts exist, but each doubles testing.</div><div class="ch2"><span class="rec">iPhone + Android phones<small>Expo builds both</small></span><span>iPhone only first<small>Fastest to ship</small></span><span>Add iPad<small>Grid layout ready (N)</small></span></div></div>
<div class="bx2"><h4>6 · Before launch, off the screen</h4><div class="sub">Not design work, but they block the store submission.</div><div class="tips" style="margin-top:10px">${['Trademark search on "OnlySwap"','Buy the domain and the @onlyswap handles','Walk the safe-exchange spots with campus police','Write the real Terms and Privacy text (the layouts are ready)','Set up help@onlyswap.app'].map(t=>`<div style="font-size:14px"><span style="width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line2);flex:none;margin-top:2px"></span><span>${t}</span></div>`).join('')}</div></div></div>`;
const ki=S.findIndex(s=>s.sec==='K');S.splice(ki,0,{sec:'K',name:'Decisions',note:'Everything that\'s still your call, on one board. The color and logo buttons work: tap one and the whole file updates.',html:decHTML,o:{w:1}});

/* ===== checklist round 4 ===== */
add('K','Fourth pass','The after-launch extras, plus a board for the decisions still open.',
`<div class="th ck">${[['Extras',[['Home screen widgets','Medium and small','X'],['Lock screen widgets','Meetup and offers','X'],['App preview video','25-second storyboard','T']]],['More devices',[['iPad browse','Grid instead of swiping','N'],['iPad inbox','Two panes','N']]],['Languages',[['Spanish screen','Real strings, longer text','N'],['Language rules','Formats, expansion, RTL','H'],['Decisions board','Color, logo and the open calls','K']]]].map(([h,items])=>`<div><h4>${h} · ${items.length}/${items.length} done</h4>${items.map(([t,s,sec])=>`<div class="cki"><span class="bx">${ic('check',15,'b')}</span><div style="flex:1"><b>${t}</b><span>${s}</span></div><span class="tag gy">${sec}</span></div>`).join('')}</div>`).join('')}</div>`,{w:1});
</script>

<script>
/* ===== compliance: age gate (Apple DAR + Google Play restrict minors) ===== */
addAfter('A','Verify code','Birthday','Required now: Google Play needs apps with anonymous features to keep minors out, and Texas, Utah and Louisiana laws require an age check. The screen is neutral on purpose: no age hint, nothing prefilled. On phones that support it, the OS age signal is asked first and this only shows as a fallback.',
`<div class="scr">${sb()}${nav('back','',stepR('3 of 5'))}<div class="ct"><div class="hl" style="margin-top:8px">When's your birthday?</div>
<p class="bd" style="margin-top:8px">We ask everyone. It's never shown on your profile.</p>
<div class="dobw"><div class="f">Month</div><div>Day</div><div>Year</div></div>
<div class="wheel"><div class="hl2"></div><div><span>July</span><span>August</span><b>September</b><span>October</span><span>November</span></div><div><span>23</span><span>24</span><b>25</b><span>26</span><span>27</span></div><div><span>2004</span><span>2005</span><b>Year</b><span>2007</span><span>2008</span></div></div>
<p class="mi" style="margin-top:14px;line-height:1.5">Used only to confirm you can use OnlySwap. Details in the <u>Privacy Policy</u>.</p></div>
${dock(`<div class="btn p dis">Continue</div>`)}</div>`);

addAfter('A','Birthday','Not eligible','Calm and final, with no way to retry a different date from here (the answer is saved server-side against the email). The account and email are deleted right away, which is what the privacy policy promises.',
`<div class="scr">${sb()}<div class="ct stc"><div class="emptyart">${ic('lock',38)}</div>
<div class="hm" style="margin-top:20px">OnlySwap isn't available to you yet</div><p class="bd" style="margin-top:8px;max-width:300px">You need to be 18 or older to use OnlySwap. We haven't kept your email or any details.</p>
<div class="card" style="margin-top:22px;width:100%;text-align:left"><div class="t" style="font-size:14.5px">Selling something before then?</div><div class="s" style="margin-top:4px">Ask a friend who's 18 or older to post it for you and meet together.</div></div></div>
${dock(`<div class="btn s">Close</div>`)}</div>`);

/* ===== reviewer login ===== */
addAfter('A','School email','Reviewer sign-in','Only for the accounts listed for Apple and Google reviewers (review.onlyswap.test). Both stores require a login that works without a one-time code. Everyone else never sees a password field.',
`<div class="scr">${sb()}${nav('back')}
<div class="ct"><div class="hl" style="margin-top:8px">What's your school email?</div>
<div class="in" style="margin-top:24px">${ic('mail',20,'mu')}<span>appreview@review.onlyswap.test</span></div>
<div class="det">${ic('building',18)}<span>Demo University · review account</span></div>
<div class="lbl" style="margin-top:16px">Password</div><div class="in f"><span>••••••••••••</span><span class="caret" style="margin-left:-4px"></span></div></div>
<div style="padding:0 20px 12px;flex:none"><div class="btn p">Sign in</div></div>${kb()}</div>`);

/* ===== notification + privacy settings (Apple 4.5.4, 5.1.1(ii)) ===== */
addAfter('F','Settings','Notification settings','Every type from the catalog, grouped. Anything promotional (tips, campus news) sits in its own group, off by default with its consent line, because Apple only allows marketing pushes after an explicit opt-in. Message previews are hidden on the lock screen unless turned on.',
`<div class="scr">${sb()}${nav('back','Notifications')}<div class="ct">
${grpS('Buying and selling',[['Offers and counters','T1'],['Messages','T1'],['Meetup reminders','T1'],['Saved search matches','T1'],['Price drops on saved items','T1']])}
${grpS('Community',[['Quad replies','T0'],['Free food nearby','T0']])}
${grpS('Lock screen',[['Show message previews','T0']])}
<div class="lbl" style="margin:16px 0 8px 4px">News and tips</div><div class="grp"><div class="li"><span class="t" style="flex:1;font-size:15px">Selling tips and campus news</span><span class="tg"></span></div><div class="li" style="border:0"><span class="s" style="font-size:12.5px;line-height:1.4">Occasional tips like when to drop a price, and news about OnlySwap at your school. Off unless you turn it on.</span></div></div>
<p class="mi" style="margin:14px 4px 0">Safety alerts and account notices always come through.</p></div></div>`);

addAfter('F','Notification settings','Privacy settings','A simple off switch for analytics. Apple requires a way to withdraw consent, and Google\'s Data safety answers depend on it.',
`<div class="scr">${sb()}${nav('back','Privacy')}<div class="ct">
${grpS('',[['Share usage analytics','T1']])}<p class="mi" style="margin:8px 4px 0;line-height:1.5">Anonymous stats about which screens get used. No messages, no location. Turning it off doesn't change anything else.</p>
${grpS('',[['Crash reports','T1']])}<p class="mi" style="margin:8px 4px 0;line-height:1.5">Sent when the app breaks so we can fix it.</p>
${grpS('Your data',[['Download your data',''],['Privacy Policy',''],['Delete account','']])}</div></div>`);

/* Settings: point Privacy row to the new page */
(function(){const s=S.find(x=>x.sec==='F'&&x.name==='Settings');if(s)s.html=s.html.replace('>Safety center<','>Safety center</span></div><div class="li"><span class="t" style="flex:1;font-size:15px">Privacy<')})();

/* ===== banned items expanded (Apple 1.4.3, Play restricted content) ===== */
(function(){const s=S.find(x=>x.sec==='X'&&x.name==='Banned items');if(!s)return;
s.note='The full list, in plain words, linked from the sell flow and every removal message. Expanded to match Apple 1.4.3 and Google Play\'s restricted content rules, and it applies to Wanted, free-stuff and Quad posts too.';
s.html=`<div class="scr">${sb()}${nav('back','Banned items')}<div class="ct" style="overflow:hidden"><p class="bd" style="margin:4px 0 6px">These can't be listed, asked for in a Wanted post, given away or posted on the Quad.</p>
<ul class="ban">${[['Alcohol, vapes, nicotine and weed','Including pouches, carts, THC or CBD products and empty bottles'],['Medication and drugs','Any prescription (like Adderall), over the counter, supplements'],['Weapons','Guns and parts, ammo, knives, pepper spray, tasers, fireworks'],['Fakes and IDs','Counterfeits, fake IDs, someone else\'s student ID'],['Tickets, meal swipes, parking','Anything tied to your school account'],['Coursework','Essays, test banks, answer keys. Textbooks are fine'],['Services and people','Rides, dates, "companionship", homework help'],['Housing and sublets','Not allowed yet']].map(([t,d])=>`<li><span class="fic" style="background:var(--redbg);color:var(--red);width:34px;height:34px">${ic('ban',17)}</span><div><div class="t" style="font-size:15px">${t}</div><div class="s" style="font-size:13px">${d}</div></div></li>`).join('')}</ul></div></div>`})();

/* ===== community rules: 18+ ===== */
(function(){const s=S.find(x=>x.sec==='A'&&x.name==='Profile');if(s)s.html=s.html.replace('3 of 4','4 of 5')})();
(function(){const s=S.find(x=>x.sec==='A'&&x.name==='Community rules');if(s){s.html=s.html.replace('4 of 4','5 of 5').replace('No alcohol, vapes, meds, weapons, tickets, meal swipes or coursework.','No alcohol, vapes, meds, weapons, fakes, tickets, meal swipes or coursework.').replace('I agree to the <u>Community Rules</u> and <u>Terms</u>','I\'m 18 or older and agree to the <u>Community Rules</u>, <u>Terms</u> and <u>Privacy Policy</u>')}})();

/* ===== Quad: naming a student ===== */
addAfter('Q','Post blocked','Post held','When a post looks like it names or rates a real student, it waits for a person to look at it instead of going live. Google\'s bullying policy and Apple 1.1.1 are the biggest risk for any anonymous board, so this check runs before posting, not after reports.',
`<div class="scr">${sb()}<div class="nv"><div class="ib" style="margin-left:-8px">${ic('x',24)}</div><div class="tt">New post</div><span style="width:60px"></span></div>
<div class="ct"><div style="font-size:18px;line-height:1.45;margin-top:18px">rate the guys on 4th floor Morrill, 1 to 10, starting with jake r</div></div>
<div class="scrim"></div><div class="sh"><div class="grab"></div><div style="width:52px;height:52px;border-radius:16px;background:var(--amberbg);color:var(--amber);display:flex;align-items:center;justify-content:center">${ic('users',26)}</div>
<div class="hm" style="margin-top:14px">This looks like it's about a real student</div>
<p class="bd" style="margin-top:6px">Posts that name, rate or single out students don't go on the Quad. If we got it wrong, send it for review and a person will check it.</p>
<div class="btn p" style="margin-top:16px">Edit post</div><div class="btn t" style="margin-top:4px">Send for review</div></div></div>`);

/* ===== legal pages: processors, 18+, Quad disclosure ===== */
(function(){const p=S.find(x=>x.sec==='X'&&x.name==='Privacy');if(p){p.html=p.html.replace('<h4>We never sell your data</h4>','<h4>Who helps us run OnlySwap</h4><p>Supabase (accounts and data), Cloudflare (photos and website), Expo and Google/Apple (push notifications), Sentry (crash reports), PostHog (usage stats, can be turned off), and our email sender. They only process data for us.</p><h4>The Quad</h4><p>Posts are anonymous to other students, not to OnlySwap. We only connect a post to an account for a valid legal request or if someone is in danger, and every time is logged.</p><h4>We never sell your data</h4>')}
const t=S.find(x=>x.sec==='X'&&x.name==='Terms');if(t){t.html=t.html.replace("'You must be a current student at your school'","'You must be 18 or older and a current student at your school'").replace('You must be a current student at your school','You must be 18 or older and a current student at your school')}
const w=S.find(x=>x.sec==='W'&&x.name==='Privacy policy · web');if(w){w.html=w.html.replace('<h3>Your choices</h3>','<h3>Who helps us run OnlySwap</h3><p>Supabase (accounts and data), Cloudflare (photos and website), Expo, Apple and Google (push notifications), Sentry (crash reports), PostHog (usage stats, can be turned off in Settings) and our email provider. They process data only on our instructions.</p><h3>The Quad</h3><p>Anonymous to other students, not to OnlySwap. An account is only connected to a post for a valid legal request or an emergency, and every lookup is logged.</p><h3>Age</h3><p>OnlySwap is for people 18 and older. We ask your age at sign-up and delete the details of anyone under 18.</p><h3>Your choices</h3>')}})();

/* ===== web: child safety standards (Google Play) ===== */
addAfter('W','Delete account · web','Child safety standards · web','Google Play asks social and anonymous-content apps for a public page on child sexual abuse and exploitation standards plus a named contact. Short, specific and linked from the Play Console.',
wf('onlyswap.app/child-safety',`${wnav}<div class="wdoc"><nav>${['Privacy policy','Terms of service','Community rules','Banned items','Safety','Child safety standards'].map((t,i)=>`<a class="${i==5?'on':''}">${t}</a>`).join('')}</nav>
<div><h1>Child safety standards</h1><p>OnlySwap is only for verified students 18 and older. We have zero tolerance for child sexual abuse and exploitation (CSAE) of any kind.</p>
<h3>What we do</h3><p>Anyone under 18 is blocked at sign-up. Any content that sexualizes minors is removed immediately, the account is banned, and we report it to the NCMEC CyberTipline as US law requires.</p>
<h3>How to report</h3><p>Use Report on any post, listing, message or profile, and choose "Something else", or email the address below. Reports about minors skip the queue.</p>
<h3>Contact</h3><p>Child safety contact: Wasif Karim, <b style="color:var(--ink)">safety@onlyswap.app</b></p></div></div>`),{w:1});

/* ===== store assets: no university trademarks, 18+, accurate claims ===== */
(function(){const MAP=[['The Ohio State University','Northfield University'],['Ohio State','Northfield'],['osu.edu','northfield.edu'],['OSU','NU'],['Buckeye Donuts','Corner Donuts'],['RPAC','Rec Center'],['Only verified students. No randoms.','Verified with your school email.'],['Age<b>17+</b>','Age<b>18+</b>']];
['App Store screenshots','App Store page','Play Store screenshots','App preview video','Play feature graphic'].forEach(n=>{const s=S.find(x=>x.sec==='T'&&x.name===n);if(!s)return;MAP.forEach(([a,b])=>{s.html=s.html.split(a).join(b)})});
const pg=S.find(x=>x.sec==='T'&&x.name==='App Store page');if(pg)pg.note='How the listing reads in the store. "New" instead of a rating at launch and an 18+ rating (overridden up from 13+, because of the anonymous Quad and meeting in person). Screenshots use a made-up school, since university names and marks can\'t appear in store assets without permission (Apple 5.2.1, Google impersonation policy).';
const sh=S.find(x=>x.sec==='T'&&x.name==='App Store screenshots');if(sh)sh.note='Five screenshots, one idea each, with real screens underneath. They show a made-up school ("Northfield") because real university names and marks need permission (Apple 5.2.1). Claims stay accurate: "verified with your school email", not "only students" (Apple 2.3.1).'})();

/* ===== H: store compliance map ===== */
add('H','Store compliance','Every Apple and Google rule that touches OnlySwap, what the design does about it, and where. Checked against the live guidelines on September 25, 2026.',
`<div class="th cmpl"><h3>Store compliance map</h3><p class="sub">Apple App Review Guidelines (updated June 8, 2026) and Google Play Developer Program Policies (July 2026 update). Status: done in design, or done in build (see the plan).</p>
<table><tr><th>Rule</th><th>What it asks</th><th>How OnlySwap meets it</th><th>Where</th></tr>
${[['Apple 1.2 · Play UGC','Filter, report, block, act on reports, contact info; terms before posting','Report and block everywhere, hide an anonymous poster, banned words, auto-hide at -5, 24h queue, rules checkbox at sign-up','A, E, Q, G'],
['Apple 1.2 (Feb 2026) · Play age-restricted (Jul 2026)','Anonymous chat is restricted; Play needs minors blocked for anonymous features','No anonymous chat at all. The Quad is a moderated board. App is 18+ with Play "Restrict minor access"','Q, A Birthday'],
['TX / UT / LA laws · Apple DAR · Play Age Signals','Check age through the store','OS age signal first, neutral birthday fallback, under-18 blocked and deleted','A Birthday, Not eligible'],
['Apple 1.4.3 · Play restricted content','No sale of drugs, tobacco, nicotine, weapons, ammo','Expanded banned list, applies to every post type','X Banned items'],
['Apple 1.1.1 · Play bullying','No defamation or harassment','Posts naming or rating students are held for review','Q Post held, Post blocked'],
['Apple 2.1 · Play App access','Working login without one-time codes','Reviewer password accounts on Demo University','A Reviewer sign-in'],
['Apple 2.3 / 5.2.1 · Play impersonation, metadata','Accurate claims, no third-party trademarks, title ≤ 30','Made-up school in store assets, "verified with your school email", "Not affiliated" line','T, W'],
['Apple 4.5.4','Promotional push only after explicit opt-in','"Selling tips and campus news" off by default with consent line','F Notification settings'],
['Apple 5.1.1(ii) · Play Data safety','Way to withdraw consent; declare all data','Analytics switch; processors named in privacy policy','F Privacy settings, X Privacy, W Privacy'],
['Apple 5.1.1(iv) · Play prominent disclosure','Explain before permission prompts; manual fallback','Pre-prompts for notifications, camera, location; spot list without location','A, X'],
['Apple 5.1.1(v) · Play account deletion','Delete in app and on the web','In-app and web delete flows','F, W'],
['Play Child safety standards','Public CSAE standards page + contact','Web page','W Child safety'],
['Apple 3.1.3(e)','Physical goods don\'t use in-app purchase','Cash in person, no payments in app','Rules, Terms'],
['Apple 4.8','Sign in with Apple only if social login is used','Email code only, not required','A'],
['Apple 2.3.10','No other platforms in iOS metadata','iOS screenshots show only the iPhone app','T']].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`,{w:1});
</script>
<script>
/* ================= RENDER ================= */
const SECS={S:['System','Tokens, type and components everything else is built from.'],K:['Checklist','The gap list from the audit, and where each item now lives.'],L:['Logo','Six directions for the mark. Pick one and it updates across the whole file.'],M:['Motion','The launch animation, every micro-interaction playing live, and a phone you can tap through with real transitions.'],A:['Sign up and onboarding','From first open to the first swipe. School email is the only gate.'],B:['Discover and buy','The swipe deck, listing page, offers, search and saved items.'],C:['Campus feed','Activity from listings plus free food and wanted posts. Gives people a reason to open the app when there\'s nothing new to swipe.'],Q:['The Quad','An anonymous board for campus, Yik Yak style. Posts and replies only, no anonymous DMs, because Apple now removes random or anonymous chat apps.'],D:['Sell','Three steps from photos to posted.'],E:['Offers and messages','Offer first, chat only after the seller accepts. Meetup, mark sold, rating, report.'],F:['Profile and settings','Your stuff, your stats, safety, and the account controls the stores require.'],X:['States and details','The screens most apps forget: login, errors, loading, offline, empty, permissions, blocked, suspended, update, help. The difference between a mockup and a real app.'],N:['Other devices and languages','Android, iPad, and what a second language looks like.'],W:['Web','The website and what a shared link looks like outside the app. Your first brief was iOS, Android and web, and this is the web half.'],T:['App Store','Everything the store submission needs: screenshots, the product page, the icon in every size, and the code email students receive.'],G:['Admin panel · web','What you see as the one person running this.'],H:['Handoff','What a developer needs besides the screens: the flow map, tokens, component states, copy rules, every notification, analytics events and the store privacy answers.']};
const board=document.getElementById('board');let html='';
Object.keys(SECS).forEach(k=>{const items=S.filter(s=>s.sec===k);if(!items.length)return;
html+=`<section class="sec" id="sec-${k}"><div class="sec-h"><span class="l">${k}</span><h2>${SECS[k][0]}</h2><p>${SECS[k][1]}</p></div><div class="row">`;
items.forEach((s,i)=>{const code=(k==='S'||k==='L'||k==='M'||k==='K')?'':k+(i+1);const inner=s.o.w?s.html:`<div class="ph ${s.o.andr?'andr':''}">${s.html}<div class="hi ${s.o.hi||''}"></div></div>`;
html+=`<div class="fr ${s.o.w?'w':''}"><div class="cap"><b>${code}</b><span>${s.name}</span></div>${inner}<div class="note" style="max-width:${s.o.w?'720px':'375px'}">${s.note}</div></div>`});
html+=`</div></section>`});
board.innerHTML=html;
document.getElementById('jump').innerHTML=Object.keys(SECS).map(k=>`<a href="#sec-${k}">${({S:'System',L:'Logo',M:'Motion',A:'A · Sign up',B:'B · Buy',C:'C · Campus',Q:'Q · Quad',D:'D · Sell',E:'E · Offers',F:'F · Profile',X:'X · States',K:'Checklist',N:'N · Devices',W:'W · Web',T:'T · Store',G:'G · Admin',H:'H · Handoff'})[k]}</a>`).join('');
document.querySelectorAll('#theme button').forEach(b=>b.onclick=()=>{document.body.dataset.theme=b.dataset.t;document.querySelectorAll('#theme button').forEach(x=>x.classList.toggle('on',x===b))});
document.querySelectorAll('#zoom button').forEach(b=>b.onclick=()=>{board.style.zoom=b.dataset.z;document.querySelectorAll('#zoom button').forEach(x=>x.classList.toggle('on',x===b))});
</script>

<style>

.plt{font-size:30px;font-weight:800;letter-spacing:-.035em;margin-top:4px}
.pltr{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:var(--acc);color:var(--onacc);font-weight:700;font-size:13px;padding:6px 10px;border-radius:8px}
.plspec{font-size:15px;line-height:1.55;color:var(--ink2);margin-top:12px;min-height:70px}
.plctl{display:flex;gap:10px;margin-top:18px}
.plctl button{height:44px;border-radius:12px;border:0;padding:0 18px;font:700 15px -apple-system,system-ui,sans-serif;cursor:pointer;background:var(--bg2);color:var(--ink);display:flex;align-items:center;gap:6px}
.plctl button.k{background:var(--ink);color:var(--bg)}
.plsteps{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:22px}
.plsteps button{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;font:600 13px/1.3 -apple-system,system-ui,sans-serif;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.plsteps button small{font-weight:500;color:var(--ink3);margin-left:auto;font-size:11.5px}
.plsteps button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plsteps button.on small{color:var(--bg);opacity:.6}
.plhint{margin-top:18px;font-size:12.5px;color:var(--ink3)}
</style>
<script>
(function(){
const FLOW=[
['A','Launch','none','App opens','The system shows a static launch screen, then the mark springs in (scale 0.55 to 1 with a small overshoot) and the wordmark rises under it.'],
['A','Welcome','dissolve','Welcome','Dissolve, 450ms. The new screen fades in while settling from 105% to 100%, so it feels like the logo opened into the app.'],
['A','School email','push','Push','Standard iOS push: about 350ms on a spring. The old screen slides 30% left and dims. Swiping from the left edge goes back.'],
['A','Verify code','push','Push','Same push. The code field is focused before the animation ends, so the keyboard rises together with the screen.'],
['A','Profile','push','Push','Push again. Onboarding keeps one consistent motion so it feels like one continuous path.'],
['A','Community rules','push','Push','Push. The checkbox ticks with a small spring and a light haptic.'],
['A','Notifications','push','Push','Push. The three example notifications drop in one after another, 80ms apart.'],
['B','Swipe','dissolve','Into the app','Onboarding is done, so no push here. The app dissolves in and the tab bar rises from the bottom.'],
['B','First swipe','none','Tutorial','Shown once. The dot demonstrates the gesture: right means make an offer, left means skip. One tap on Got it and it never comes back.'],
['B','Swipe, mid-drag','none','Drag','The card follows your finger 1:1 and tilts with the drag. The stamp fades in with distance. Nothing is animated by a timer.'],
['B','Make an offer','sheet','Sheet','Released past the line: the offer sheet slides up in 350ms and the screen behind dims.'],
['B','Offer sent','dissolve','Confirm','The sheet drops and the confirmation dissolves in. The check draws itself, with a success haptic.'],
['E','Inbox · offers','tab','Tab switch','Tabs never slide. A quick 150ms crossfade and a selection haptic.'],
['E','Incoming offer','push','Push','Push into the offer. The amount counts up from $0 to $50 in 400ms.'],
['E','Chat','push','Push','Accepting pushes straight into the new chat. The meetup card pops in when it arrives.'],
['E','Plan the pickup','sheet','Sheet','Plan-the-pickup sheet. Time slots are tappable pills with a selection haptic.'],
['E','Meetup day','push','Push','Opened from the 30-minute reminder. I\'m here pings the buyer, and sharing with a friend is one tap.'],
['Q','Quad','tab','Tab switch','Crossfade to the Quad tab. Posts load newest-first with skeletons if the network is slow.'],
['Q','Post','push','Push','Push into the thread. Your own emoji identity for this thread shows in the reply box.'],
['Q','New post','sheet','Sheet','The composer opens as a full sheet, keyboard already up. The name warning slides in under the text as you type.'],
['F','Profile','tab','Tab switch','Crossfade to Profile.'],
['F','My listings','push','Push','Push. The weekly numbers count up once, then stay still.']
];
const wrap=document.getElementById('plw');if(!wrap)return;
wrap.innerHTML=`<div class="ph plph" id="plph"></div><div class="plside"><div class="plno" id="plno"></div><div class="plt" id="plt"></div><div class="pltr" id="pltr"></div><div class="plspec" id="plspec"></div>
<div class="plctl"><button id="plprev">${ic('back',18,'b')} Back</button><button class="k" id="plnext">Next ${ic('chev',18,'b')}</button><button id="plreplay">${ic('refresh',17,'b')} Play from start</button></div>
<div class="plsteps" id="plsteps">${FLOW.map((f,i)=>`<button data-i="${i}"><span>${i+1}. ${f[1]}</span><small>${f[3]}</small></button>`).join('')}</div>
<div class="plhint">Tap the phone to go forward. Arrow keys work too.</div></div>`;
const ph=document.getElementById('plph');let idx=-1,cur=null,busy=[],timer=null;
const E='cubic-bezier(.2,.8,.2,1)';
function layer(i){const f=FLOW[i];const s=S.find(x=>x.sec===f[0]&&x.name===f[1]);const d=document.createElement('div');d.className='pll';d.innerHTML=(s?s.html:'<div class="scr"></div>')+`<div class="hi ${s&&s.o.hi||''}"></div>`;return d}
function finish(){busy.forEach(a=>a.finish());busy=[];[...ph.children].forEach(c=>{if(c!==cur)c.remove()});}
function go(i,auto){if(i<0||i>=FLOW.length)return;finish();clearTimeout(timer);const back=i<idx;const nl=layer(i);const old=cur;
const t=back?FLOW[idx][2]:FLOW[i][2];
if(back&&old){ph.insertBefore(nl,old)}else ph.appendChild(nl);
cur=nl;const A=(el,kf,o)=>{const a=el.animate(kf,Object.assign({easing:E,fill:'none'},o));busy.push(a);return a};
if(old){
 if(t==='push'){ if(!back){A(nl,[{transform:'translateX(100%)'},{transform:'translateX(0)'}],{duration:380});A(old,[{transform:'translateX(0)',filter:'brightness(1)'},{transform:'translateX(-30%)',filter:'brightness(.82)'}],{duration:380})}
   else{A(old,[{transform:'translateX(0)'},{transform:'translateX(100%)'}],{duration:340});A(nl,[{transform:'translateX(-30%)',filter:'brightness(.82)'},{transform:'translateX(0)',filter:'brightness(1)'}],{duration:340})}}
 else if(t==='sheet'){ if(!back){A(nl,[{transform:'translateY(100%)'},{transform:'translateY(0)'}],{duration:420})}else{A(old,[{transform:'translateY(0)'},{transform:'translateY(100%)'}],{duration:260})}}
 else if(t==='tab'){A(nl,[{opacity:0},{opacity:1}],{duration:170,easing:'linear'})}
 else if(t==='dissolve'){A(nl,[{opacity:0,transform:'scale(1.05)'},{opacity:1,transform:'scale(1)'}],{duration:460})}
 const all=busy.slice();Promise.all(all.map(a=>a.finished.catch(()=>{}))).then(()=>{if(cur===nl){[...ph.children].forEach(c=>{if(c!==cur)c.remove()});busy=[]}});
}
idx=i;const f=FLOW[i];
document.getElementById('plno').textContent=`Step ${i+1} of ${FLOW.length}`;
document.getElementById('plt').textContent=f[1];
document.getElementById('pltr').innerHTML=`${ic('swap',15,'b')} ${f[3]}`;
document.getElementById('plspec').textContent=f[4];
document.querySelectorAll('#plsteps button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
if(i===0&&auto){timer=setTimeout(()=>{if(idx===0)go(1)},1700)}}
ph.onclick=()=>go(idx+1<FLOW.length?idx+1:0,idx+1>=FLOW.length);
document.getElementById('plnext').onclick=()=>go(idx+1);
document.getElementById('plprev').onclick=()=>go(idx-1);
document.getElementById('plreplay').onclick=()=>{idx=-1;go(0,true)};
document.querySelectorAll('#plsteps button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1)});
go(0);
})();
</script>
</body></html>
