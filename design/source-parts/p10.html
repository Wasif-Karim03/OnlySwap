<style>
@keyframes shim{0%{background-position:100% 0}100%{background-position:0 0}}
.sk{background:linear-gradient(90deg,var(--bg2) 30%,var(--bg3) 50%,var(--bg2) 70%);background-size:300% 100%;animation:shim 1.3s linear infinite;border-radius:8px}
.off{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:9px 14px;margin:0 16px 6px;border-radius:12px;flex:none}
.emptyart{width:88px;height:88px;border-radius:26px;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.stc{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.m.fail{background:var(--redbg);color:var(--red)}
.mst{align-self:flex-end;font-size:11.5px;color:var(--ink3);margin:-2px 4px 2px;display:flex;gap:4px;align-items:center}
.mst.r{color:var(--red);font-weight:600}
.typing{align-self:flex-start;background:var(--bg2);border-radius:19px;border-bottom-left-radius:6px;padding:12px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:4px;background:var(--ink3);animation:tdot 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.mimg{align-self:flex-end;width:180px;height:140px;border-radius:18px;border-bottom-right-radius:6px;position:relative;overflow:hidden}
.mimg .up{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.ring{width:38px;height:38px;border-radius:19px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script>
/* ================= X · STATES & DETAILS ================= */
add('X','Log in','Returning users on a new phone. Same email and code, no onboarding again. They land back where they left off.',
`<div class="scr">${sb()}${nav('back')}<div class="ct"><div style="display:flex;align-items:center;gap:10px;margin-top:6px">${mark(40,'var(--acc)','var(--onacc)')}<span style="font-size:22px;font-weight:800;letter-spacing:-.05em">onlyswap</span></div>
<div class="hl" style="margin-top:22px">Welcome back</div><p class="bd" style="margin-top:6px">Enter your school email and we'll send a code. No password to remember.</p>
<div class="in f" style="margin-top:22px">${ic('mail',20,'mu')}<span>wkarim.12@osu.edu</span><span class="caret" style="margin-left:-6px"></span></div>
<div class="sm" style="margin-top:14px">New here? <b style="color:var(--ink)">Create an account</b></div></div>
<div style="padding:0 20px 12px;flex:none"><div class="btn p">Send code</div></div>${kb()}</div>`);

add('X','Code errors','Wrong code shakes the boxes and says so. After five tries, a short lockout instead of an open door for guessing.',
`<div class="scr">${sb()}${nav('back')}<div class="ct"><div class="hl" style="margin-top:8px">Enter the code</div><p class="bd" style="margin-top:8px">Sent to <b style="color:var(--ink)">wkarim.12@osu.edu</b></p>
<div class="code">${['4','8','1','2','0','6'].map(d=>`<div class="cd" style="background:var(--redbg);color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)">${d}</div>`).join('')}</div>
<div class="err" style="margin-top:12px">${ic('info',16)}<span>That code isn't right. 2 tries left.</span></div>
<div class="card" style="margin-top:34px"><div class="t" style="font-size:15px">After 5 wrong tries</div><div class="s" style="margin-top:4px">"Too many tries. Wait 10 minutes, or get a new code." The resend button becomes the main action.</div></div>
<div class="card" style="margin-top:10px"><div class="t" style="font-size:15px">Code expired</div><div class="s" style="margin-top:4px">"This code expired. We just sent you a new one." Sent automatically, no extra tap.</div></div></div>${np()}</div>`);

add('X','Loading','Skeletons shaped like the real content, only if loading takes longer than about 300ms. Faster than that, nothing flashes at all.',
`<div class="scr">${sb()}${dhead('swipe')}<div class="stg"><div class="sc sk" style="border-radius:24px"></div>
<div style="position:absolute;left:18px;right:18px;bottom:20px"><div class="sk" style="height:30px;width:90px;background-color:rgba(255,255,255,.6)"></div><div class="sk" style="height:18px;width:220px;margin-top:10px"></div><div class="sk" style="height:14px;width:170px;margin-top:10px"></div></div></div>
<div class="acts"><div class="ab x" style="opacity:.35">${ic('x',28,'b')}</div><div class="ab s" style="opacity:.35">${ic('bookmark',22)}</div><div class="ab o" style="opacity:.35">$</div></div>${tb('Discover')}</div>`);

add('X','Offline','A banner, not a dead screen. Messages typed offline wait in line and send by themselves when the connection is back.',
`<div class="scr">${sb()}${chat(`<div class="m th">rpac at 4:30?</div><div class="m me">yes works</div><div class="mst">${ic('clock',12)} Waiting for connection</div>`).replace('<div class="msgs">','<div class="off">'+ic('wifi',17)+'You\'re offline. Messages will send when you\'re back.</div><div class="msgs">').replace(sb(),'')}</div>`);

add('X','No results','Always offers a next step: loosen the filters, save the search, or ask the campus for it.',
`<div class="scr">${sb()}<div class="nv" style="gap:8px"><div class="ib" style="margin-left:-8px">${ic('back',22)}</div><div class="in" style="flex:1;height:42px;font-size:16px">${ic('search',18,'mu')}<span style="flex:1">standing desk</span>${ic('x',18,'mu')}</div></div>
<div class="hsc"><span class="ch">${ic('sliders',16)} Filters <b class="cnt2">3</b></span><span class="ch on">Under $30 ${ic('x',13,'b')}</span><span class="ch on">Like new ${ic('x',13,'b')}</span></div>
<div class="ct stc"><div class="emptyart">${ic('search',38)}</div><div class="hm" style="margin-top:20px">No standing desks under $30</div><p class="bd" style="margin-top:6px;max-width:280px">3 show up if you remove the price filter.</p>
<div style="width:100%;margin-top:24px;display:flex;flex-direction:column;gap:10px"><div class="btn k">Show 3 results over $30</div><div class="btn s">${ic('bell',19)} Tell me when one's listed</div><div class="btn t">Post it on Wanted</div></div></div>${tb('Discover')}</div>`);

add('X','Empty inbox','First-week state. It explains how the inbox fills up, instead of just saying "nothing here".',
`<div class="scr">${sb()}<div class="ct"><div class="hl" style="margin-top:6px">Inbox</div><div class="sg" style="margin-top:14px"><div class="on">Offers</div><div>Chats</div></div>
<div class="stc" style="margin-top:90px"><div class="emptyart">${ic('tag',38)}</div><div class="hm" style="margin-top:20px">No offers yet</div><p class="bd" style="margin-top:6px;max-width:280px">Offers you make and offers on your stuff show up here. Chats open once an offer is accepted.</p>
<div class="btn p" style="margin-top:24px">Start swiping</div></div></div>${tb('Inbox')}</div>`);

add('X','Session expired','A sheet over wherever you were, not a kick back to the start. Enter the code and you\'re right back on the same screen.',
`<div class="scr">${OFFER_SELLER}<div class="scrim"></div><div class="sh"><div class="grab"></div><div class="hm">Quick check it's you</div>
<p class="bd" style="margin-top:6px">It's been a while. We sent a code to wkarim.12@osu.edu.</p>
<div class="code" style="margin-top:18px">${['','','','','',''].map((d,i)=>`<div class="cd ${i==0?'f':''}">${i==0?'<span class="caret"></span>':''}</div>`).join('')}</div>
<div class="btn p dis" style="margin-top:18px">Continue</div><div class="btn t" style="margin-top:2px">Log out instead</div></div></div>`);

add('X','Re-verify','Once a year, and after graduation month. It keeps alumni and lapsed accounts off a students-only app.',
`<div class="scr">${sb()}${nav('x')}<div class="ct"><div style="width:64px;height:64px;border-radius:20px;background:var(--bg2);display:flex;align-items:center;justify-content:center">${ic('shield',32)}</div>
<div class="hl" style="margin-top:18px">Still at Ohio State?</div><p class="bd" style="margin-top:8px">Once a year we check that everyone is a current student. It takes 20 seconds, same code as when you signed up.</p>
<div class="grp" style="margin-top:22px"><div class="li"><span class="t" style="flex:1;font-size:15px">School email</span><span class="s">wkarim.12@osu.edu</span></div><div class="li" style="border:0"><span class="t" style="flex:1;font-size:15px">Due by</span><span class="s">Aug 31, 2027</span></div></div>
<div class="grp" style="margin-top:12px"><div class="li" style="border:0"><div style="flex:1"><div class="t" style="font-size:15px">Transferred or graduated?</div><div class="s">Switch schools or close your account</div></div>${ic('chev',18,'mu')}</div></div></div>
${dock(`<div class="btn p">Send code</div><div class="btn t" style="margin-top:2px">Remind me next week</div>`)}</div>`);

add('X','Suspended','Says what happened, until when, and what still works. There\'s always an appeal path.',
`<div class="scr">${sb()}<div class="ct stc"><div style="width:80px;height:80px;border-radius:40px;background:var(--redbg);color:var(--red);display:flex;align-items:center;justify-content:center">${ic('ban',38)}</div>
<div class="hl" style="margin-top:20px">Your account is paused</div><p class="bd" style="margin-top:8px;max-width:300px">A listing broke the banned items rule (vapes). Your account is paused until <b style="color:var(--ink)">Oct 2 at 9:00 AM</b>.</p>
<div class="card" style="margin-top:22px;width:100%;text-align:left"><div class="t" style="font-size:14.5px">While paused</div><div class="tips" style="margin-top:6px"><div>${ic('x',16,'b')}<span>You can't list, offer, or post</span></div><div>${ic('check',16,'b')}<span>You can still read and finish chats you already had open</span></div></div></div></div>
${dock(`<div class="btn k">Appeal this</div><div class="btn t" style="margin-top:2px">Read the rules</div>`)}</div>`);

add('X','Update required','Only for breaking changes. It explains why in one line, so it doesn\'t feel like a wall.',
`<div class="scr">${sb()}<div class="ct stc">${mark(84,'var(--acc)','var(--onacc)')}
<div class="hl" style="margin-top:24px">Time to update</div><p class="bd" style="margin-top:8px;max-width:290px">This version can't send offers anymore. The update takes about 20 seconds and keeps everything you had.</p></div>
${dock(`<div class="btn p">${ic('download',19)} Update OnlySwap</div><div class="mi" style="text-align:center;margin-top:12px">Version 1.0.4 · you're on 1.0.1</div>`)}</div>`);

add('X','Maintenance','Rare, but it happens. A time estimate and somewhere to check status beats a generic error.',
`<div class="scr">${sb()}<div class="ct stc"><div class="emptyart">${ic('tool',38)}</div>
<div class="hm" style="margin-top:20px">Back in about 15 minutes</div><p class="bd" style="margin-top:8px;max-width:290px">We're upgrading things behind the scenes. Nothing you've listed or saved is affected.</p></div>
${dock(`<div class="btn s">Check status</div>`)}</div>`);
</script>
