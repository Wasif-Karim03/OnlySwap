<style>
.wb{flex:1;min-height:0;overflow:hidden;position:relative}
.wnav{height:68px;display:flex;align-items:center;gap:28px;padding:0 48px;border-bottom:1px solid var(--line)}
.wlogo{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:800;letter-spacing:-.055em}
.wnav a{font-size:14.5px;font-weight:600;color:var(--ink2);text-decoration:none}
.wbtn{height:44px;border-radius:12px;padding:0 18px;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap}
.wbtn.p{background:var(--acc);color:var(--onacc)}.wbtn.k{background:var(--ink);color:var(--bg)}.wbtn.s{background:var(--bg2);color:var(--ink)}
.whero{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;padding:56px 48px 0;align-items:center}
.wh1{font-size:62px;font-weight:800;letter-spacing:-.05em;line-height:1}
.wlead{font-size:19px;line-height:1.5;color:var(--ink2);margin-top:20px;max-width:520px}
.wform{display:flex;gap:10px;margin-top:28px;max-width:520px}
.wform .in{flex:1;height:56px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line2)}
.wform .wbtn{height:56px;padding:0 22px;font-size:16px}
.wstore{display:flex;gap:10px;margin-top:22px}
.wstore div{height:48px;border-radius:12px;background:#111;color:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:11px;line-height:1.1}
.wstore b{display:block;font-size:16px;font-weight:700}
.scaleph{width:375px;height:812px;transform-origin:top left;position:absolute;top:0;left:0}
.phwrap{position:relative;flex:none;border-radius:40px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.1)}
.qr{display:grid;grid-template-columns:repeat(21,1fr);width:120px;height:120px;background:#fff;padding:6px;border-radius:10px}
.qr i{background:#111}.qr b{background:transparent}
.safari{position:absolute;left:0;right:0;bottom:0;height:84px;background:rgba(248,248,248,.96);border-top:.5px solid rgba(0,0,0,.15);z-index:30;padding:10px 16px 0}
.safari .url{height:44px;border-radius:12px;background:rgba(118,118,128,.14);display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;color:#111;padding:0}
.sab{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--line);flex:none}
/* store */
.shots{width:1380px;background:var(--bg);border-radius:24px;padding:26px;box-shadow:0 0 0 1px rgba(0,0,0,.08);display:flex;gap:16px}
.shot{width:252px;height:546px;border-radius:26px;background:var(--acc);color:var(--onacc);position:relative;overflow:hidden;flex:none}
.shot h5{font-size:23px;font-weight:800;letter-spacing:-.035em;line-height:1.1;padding:26px 22px 0}
.shot .phwrap{position:absolute;left:26px;top:128px;border-radius:32px}
.shot.sm .phwrap{left:21px;top:96px;border-radius:26px}
.asp{padding:0 20px}
.asrow{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:16px}
.asrow div{text-align:center;flex:1;font-size:11px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.asrow div+div{border-left:1px solid var(--line)}
.asrow b{display:block;font-size:17px;color:var(--ink2);margin-top:3px;text-transform:none;letter-spacing:0}
.getb{height:30px;border-radius:15px;background:#007AFF;color:#fff;font-weight:700;font-size:15px;padding:0 20px;display:inline-flex;align-items:center}
.mailc{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:24px 22px;margin-top:14px}
.codebig{font-size:40px;font-weight:800;letter-spacing:.12em;margin:16px 0;font-variant-numeric:tabular-nums}
.icons{width:1380px;background:var(--bg);color:var(--ink);border-radius:24px;padding:30px;box-shadow:0 0 0 1px rgba(0,0,0,.08);display:flex;gap:44px;align-items:flex-end;flex-wrap:wrap}
.icons .g{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--ink3);font-weight:600}
.icons h4{font-size:12.5px;color:var(--ink3);font-weight:700;margin-bottom:12px}
</style>
<script>
function webf(url,body){return `<div class="dk"><div class="chrome"><i></i><i></i><i></i><div class="url">${ic('lock',12)} ${url}</div></div><div class="wb">${body}</div></div>`}
const WLOGO=`<div class="wlogo">${mark(34,'var(--acc)','var(--onacc)')}onlyswap</div>`;
function phmini(sec,name,scale){const s=S.find(x=>x.sec===sec&&x.name===name);return `<div class="phwrap" style="width:${375*scale}px;height:${812*scale}px"><div class="ph scaleph" style="transform:scale(${scale});box-shadow:none">${s?s.html:''}<div class="hi ${s&&s.o.hi||''}"></div></div></div>`}
function qrsvg(){let h='';let seed=7;const r=()=>{seed=(seed*9301+49297)%233280;return seed/233280};for(let y=0;y<21;y++)for(let x=0;x<21;x++){const f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);let on;if(f){const cx=x<7?x:x-14,cy=y<7?y:y-14;on=cx==0||cx==6||cy==0||cy==6||(cx>1&&cx<5&&cy>1&&cy<5)}else on=r()>.52;h+=on?'<i></i>':'<b></b>'}return `<div class="qr">${h}</div>`}
const STORES=`<div class="wstore"><div>${ic('phone',20)}<span>Download on the<b>App Store</b></span></div><div>${ic('download',20)}<span>Get it on<b>Google Play</b></span></div></div>`;

/* ================= W · WEB ================= */
add('W','Campus landing page','onlyswap.app. Its only jobs: explain the app in one sentence, show real stuff for sale, and collect .edu emails for campuses that aren\'t open yet.',
webf('onlyswap.app',`<div class="wnav">${WLOGO}<a style="margin-left:18px">How it works</a><a>Safety</a><a>For schools</a><div style="margin-left:auto" class="wbtn k">Get the app</div></div>
<div class="whero"><div><div class="tag gy" style="font-size:13px;padding:6px 10px">${ic('shield',14,'b')} Students only · .edu verified</div>
<div class="wh1" style="margin-top:18px">Buy and sell with students at your school.</div>
<p class="wlead">Swipe through what people on your campus are selling, make an offer, and meet at a safe spot between classes. No shipping, no strangers.</p>
<div class="wform"><div class="in">${ic('mail',20,'mu')}<span style="color:var(--ink3)">you@school.edu</span></div><div class="wbtn p">Join your campus</div></div>
<div class="card" style="max-width:520px;margin-top:16px;padding:14px 16px"><div class="rw" style="margin:0"><span class="t" style="font-size:14.5px">Ohio State · opening soon</span><span class="sm"><b style="color:var(--ink)">488</b> / 500 students</span></div><div class="bar" style="margin-top:10px;height:8px"><i style="width:97.6%"></i></div></div>
${STORES}</div>
<div style="position:relative;height:640px;display:flex;justify-content:center">
<div style="position:absolute;left:20px;top:40px;transform:rotate(-6deg)">${phmini('B','Swipe',.62)}</div>
<div style="position:absolute;right:30px;top:0;transform:rotate(5deg)">${phmini('Q','Quad',.62)}</div>
<div class="fl" style="left:0;top:470px">${mini('fridge','Mini fridge','$40','Baker Hall')}</div>
<div class="fl" style="right:10px;top:520px">${mini('books','CHEM 1210 books','$25','Thompson')}</div></div></div>`),{w:1});

add('W','Shared listing · desktop','Where a shared link lands on a laptop. Anyone can look, but only verified students from that campus can make an offer, and that happens in the app.',
webf('onlyswap.app/l/k3f9',`<div class="wnav">${WLOGO}<div style="margin-left:auto;display:flex;gap:10px"><div class="wbtn s">Log in</div><div class="wbtn k">Get the app</div></div></div>
<div style="display:grid;grid-template-columns:1.25fr 1fr;gap:44px;padding:36px 48px">
<div><div class="im" style="height:470px;border-radius:22px;${I('fridge',1200)}"></div><div style="display:flex;gap:10px;margin-top:12px">${['fridge','fridge2','fridge','fridge2'].map((k,i)=>`<div class="im" style="width:84px;height:84px;border-radius:12px;${I(k,200)};${i?'opacity:.55':'box-shadow:0 0 0 2.5px var(--ink)'}"></div>`).join('')}</div></div>
<div><div class="mi">Ohio State · Appliances · posted 12 min ago</div><div style="font-size:48px;font-weight:800;letter-spacing:-.045em;margin-top:8px">$40</div><div class="hm" style="margin-top:2px">Mini fridge, 3.1 cu ft</div>
<div class="chips" style="margin-top:14px"><span class="ch g">Good condition</span><span class="ch g">${ic('pin',15)} RPAC safe-exchange zone</span></div>
<p class="bd" style="margin-top:16px;color:var(--ink)">Galanz, small freezer on top. Moving into an apartment with a real kitchen so it has to go. Little dent on the left side. It's heavy, bring a friend.</p>
<div class="bcard" style="margin-top:18px">${av('D',AVC.D,44)}<div style="flex:1"><div class="t">Devin P. <span class="vf">${ic('shield',14,'b')} Verified</span></div><div class="s">9 swaps · usually replies within an hour</div></div></div>
<div class="card" style="margin-top:14px;display:flex;gap:18px;align-items:center">${qrsvg()}<div><div class="t">Make an offer in the app</div><div class="s" style="margin-top:4px">Scan with your phone camera. Only Ohio State students can make offers.</div><div class="wbtn p" style="margin-top:12px">Open in OnlySwap</div></div></div></div></div>`),{w:1});

add('W','Shared listing · phone','Same link opened on a phone in Safari. A smart banner at the top jumps into the app if it\'s installed, or to the App Store if not.',
`<div class="scr">${sb()}<div class="sab">${mark(40,'var(--acc)','var(--onacc)')}<div style="flex:1"><div class="t" style="font-size:14px">OnlySwap</div><div class="s" style="font-size:12px">Open this listing in the app</div></div><div class="btn" style="width:auto;height:30px;padding:0 14px;border-radius:15px;background:#007AFF;color:#fff;font-size:14px">Open</div></div>
<div class="im" style="height:330px;flex:none;${I('fridge',800)}"></div>
<div class="ct" style="padding-top:16px"><div class="mi">Ohio State · posted 12 min ago</div><div class="hl" style="margin-top:4px">$40</div><div class="hs" style="font-size:19px">Mini fridge, 3.1 cu ft</div>
<div class="bcard" style="margin-top:14px">${av('D',AVC.D,40)}<div style="flex:1"><div class="t" style="font-size:15px">Devin P. <span class="vf">${ic('shield',14,'b')} Verified</span></div><div class="s" style="font-size:12.5px">9 swaps</div></div></div>
<div class="btn p" style="margin-top:16px">Make an offer in the app</div></div>
<div class="safari"><div class="url">${ic('lock',13)} onlyswap.app</div></div></div>`);

add('W','Browse on desktop','For students on a laptop in the library. Same listings, a normal grid with filters, and offers still go through the same accept-first flow.',
webf('onlyswap.app/osu',`<div class="wnav" style="gap:18px">${WLOGO}<div class="in" style="width:440px;height:44px;font-size:15px;margin-left:24px">${ic('search',18,'mu')}<span style="color:var(--ink3)">Search Ohio State</span></div><div class="dd" style="height:44px">${ic('building',16)} Ohio State ${ic('down',14)}</div><div style="margin-left:auto;display:flex;gap:6px;align-items:center"><div class="ib">${ic('quad',22)}</div><div class="ib">${ic('chat',22)}</div><div class="wbtn p" style="height:40px">${ic('plus',18,'b')} Sell</div>${av('W',AVC.W,36)}</div></div>
<div style="display:grid;grid-template-columns:220px 1fr;gap:36px;padding:28px 48px">
<div><div class="lbl">Category</div>${['All','Dorm & furniture','Textbooks','Tech','Clothes & shoes','Kitchen','Bikes & scooters','Free stuff'].map((c,i)=>`<div class="an ${i==0?'on':''}" style="padding:8px 10px">${c}</div>`).join('')}
<div class="lbl" style="margin-top:18px">Condition</div><div class="chips">${['New','Like new','Good','Fair'].map((x,i)=>`<span class="ch sm2 ${i==1||i==2?'on':''}">${x}</span>`).join('')}</div></div>
<div><div class="rw" style="margin:0 0 16px"><span class="hm">214 listings at Ohio State</span><div class="dd">Newest ${ic('down',14)}</div></div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:22px 16px">${[['fridge','$40','Mini fridge','Baker Hall · 12m'],['lamp','$12','Desk lamp, black','Lincoln Tower · 2h'],['pods','$85','AirPods Pro','RPAC · 1h'],['sw','$180','Switch + 2 games','Morrill · 3h'],['chair','$30','Desk chair, grey','Morrill · 5h'],['books','$25','CHEM 1210 bundle','Thompson · 6h'],['bike','$120','Trek city bike','Off campus · 1d'],['mw','$25','Microwave','Baker Hall · 2d']].map(a=>gcard(...a)).join('')}</div></div></div>`),{w:1});

/* ================= T · STORE ================= */
add('T','App Store screenshots','Five screenshots, one idea each, with real screens underneath. The first two carry the most weight because most people never scroll past them.',
`<div class="th shots">${[['Swipe what\'s for sale on your campus','B','Swipe'],['Make an offer. Chat once they say yes.','B','Make an offer'],['Meet at a safe spot. Pay in person.','E','Meetup day'],['Only verified students. No randoms.','A','School email'],['Say it anonymously on the Quad','Q','Quad']].map(([c,s,n])=>`<div class="shot"><h5>${c}</h5>${phmini(s,n,.53)}</div>`).join('')}</div>`,{w:1});

add('T','App Store page','How the listing reads in the store. "New" instead of a rating at launch, an honest 17+ rating because of user posts, and screenshots that explain the app before anyone reads the text.',
`<div class="scr" style="background:#fff;color:#111">${sb()}<div class="nv" style="color:#007AFF;font-size:17px"><span style="display:flex;align-items:center;margin-left:-6px">${ic('back',24)} Search</span></div>
<div class="asp" style="--line:#E6E6E6;--ink2:#6b6b6b;--ink3:#8e8e93;--ink:#111"><div style="display:flex;gap:16px">${mark(112,'var(--acc)','var(--onacc)')}<div style="display:flex;flex-direction:column"><div style="font-size:22px;font-weight:700;letter-spacing:-.02em">OnlySwap</div><div style="font-size:14.5px;color:#8e8e93">Buy and sell on your campus</div><div style="margin-top:auto;display:flex;align-items:center;gap:14px"><span class="getb">Get</span><span style="color:#007AFF">${ic('share',20)}</span></div></div></div>
<div class="asrow"><div>Ratings<b>New</b></div><div>Age<b>17+</b></div><div>Category<b>Shopping</b></div><div>Size<b>42 MB</b></div></div>
<div style="display:flex;gap:10px;margin-top:16px;overflow:hidden">${[['Swipe what\'s for sale on your campus','B','Swipe'],['Make an offer. Chat once they say yes.','B','Make an offer']].map(([c,s,n])=>`<div class="shot sm" style="width:200px;height:433px;border-radius:20px"><h5 style="font-size:18px;padding:20px 18px 0">${c}</h5>${phmini(s,n,.42)}</div>`).join('')}</div>
<p style="font-size:14.5px;line-height:1.45;margin-top:14px">A marketplace only students at your school can use. Swipe through what people on campus are selling, make an offer, and meet at a safe spot. <span style="color:#007AFF">more</span></p></div></div>`);

add('T','Verification email','The first thing anyone ever gets from OnlySwap. The code is in the subject line, so it shows up in the notification and iOS can offer to fill it in.',
`<div class="scr" style="background:#fff;color:#111">${sb()}<div class="nv" style="color:#007AFF;font-size:17px"><span style="display:flex;align-items:center;margin-left:-6px">${ic('back',24)} Inbox</span></div>
<div class="ct" style="--line:#E6E6E6;--ink2:#6b6b6b;--ink3:#8e8e93;--ink:#111;--bg:#fff"><div style="display:flex;gap:10px;align-items:center;margin-top:6px">${mark(40,'var(--acc)','var(--onacc)')}<div style="flex:1"><div class="t" style="font-size:15px">OnlySwap</div><div class="s" style="font-size:13px">to me · 9:41 AM</div></div></div>
<div class="hm" style="margin-top:14px;font-size:21px">481 206 is your OnlySwap code</div>
<div class="mailc"><div style="display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;letter-spacing:-.05em">${mark(26,'var(--acc)','var(--onacc)')}onlyswap</div>
<p style="font-size:15px;margin-top:18px">Here's your code to finish signing up:</p><div class="codebig">481 206</div>
<p style="font-size:14px;line-height:1.5;color:#555">It expires in 10 minutes. If you didn't try to sign up, you can ignore this. Someone may have typed your email by mistake.</p>
<p style="font-size:12px;line-height:1.5;color:#999;margin-top:22px;border-top:1px solid #eee;padding-top:14px">OnlySwap · a marketplace for students at your school. You got this because wkarim.12@osu.edu was entered at signup.</p></div></div></div>`);

add('T','App icon sheet','Every size the stores ask for, generated from the chosen logo. Also shows the iOS dark and tinted versions and the one-color Android notification icon. Switch the logo at the top and the whole sheet updates.',
`<div class="th icons"><div class="g">${mark(200,'var(--acc)','var(--onacc)')}1024 · App Store</div>
<div><h4>iPhone</h4><div style="display:flex;gap:18px;align-items:flex-end">${[180,120,87,80,60,40,29].map(s=>`<div class="g">${mark(Math.round(s/1.5),'var(--acc)','var(--onacc)')}${s}</div>`).join('')}</div></div>
<div><h4>iOS dark and tinted</h4><div style="display:flex;gap:14px">${`<div class="g">${mark(80,'#111','var(--acc)')}Dark</div><div class="g">${mark(80,'#2a2a2c','#bdbdbd')}Tinted</div>`}</div></div>
<div><h4>Android</h4><div style="display:flex;gap:14px;align-items:flex-end"><div class="g"><span class="lm" style="width:80px;height:80px;border-radius:40px;background:var(--acc);color:var(--onacc);--cut:var(--acc)"><svg width="46" height="46" viewBox="0 0 100 100"><use href="#lg-cur"/></svg></span>Round</div><div class="g"><span class="lm" style="width:80px;height:80px;border-radius:28px;background:var(--acc);color:var(--onacc);--cut:var(--acc)"><svg width="46" height="46" viewBox="0 0 100 100"><use href="#lg-cur"/></svg></span>Squircle</div><div class="g"><span class="lm" style="width:48px;height:48px;border-radius:12px;background:#5f6368;color:#fff;--cut:#5f6368"><svg width="30" height="30" viewBox="0 0 100 100"><use href="#lg-cur"/></svg></span>Notification</div></div></div></div>`,{w:1});
</script>
