# Keeps the production project from pausing (P14-KEEP-01; Supabase Free pauses
# after 7 days without activity). Calls the `health` function, which runs
# `select 1`. The URL is the public production Supabase functions URL (the same
# value the app ships with), so no secret or variable is needed. Delete this file
# after launch if prod gets daily traffic.
name: Keepalive

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping production
        run: curl -fsS --retry 3 --retry-delay 10 "https://okbbyqbajfaweeyxryuw.supabase.co/functions/v1/health"
