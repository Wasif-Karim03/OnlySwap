<style>
.qhd{display:flex;align-items:flex-end;justify-content:space-between;padding:2px 16px 8px 20px;flex:none}
.qhd h2{font-size:26px;font-weight:800;letter-spacing:-.04em;line-height:1}
.qhd .mi{margin-top:4px;display:flex;gap:5px;align-items:center}
.qtabs{display:flex;gap:20px;padding:0 20px;border-bottom:1px solid var(--line);flex:none}
.qtabs span{font-size:15px;font-weight:700;color:var(--ink3);padding:4px 0 9px}
.qtabs .on{color:var(--ink);box-shadow:inset 0 -2.5px 0 var(--ink)}
.qp{display:flex;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.qm{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--ink3)}
.qf{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--bg2);color:var(--ink2)}
.qt{font-size:16px;line-height:1.4;margin-top:6px;letter-spacing:-.01em}
.qa{display:flex;align-items:center;gap:5px;margin-top:10px;font-size:13px;color:var(--ink3);font-weight:600}
.qimg{height:160px;border-radius:14px;margin-top:10px}
.qv{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink3);width:40px;flex:none;padding-top:2px}
.qv b{font-size:15px;color:var(--ink);font-weight:750;font-variant-numeric:tabular-nums}
.qv span{width:30px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.qv.up .u{background:var(--acc);color:var(--onacc)}.qv.dn .d{background:var(--ink);color:var(--bg)}
.po{position:relative;height:38px;border-radius:10px;background:var(--bg2);display:flex;align-items:center;justify-content:space-between;padding:0 12px;margin-top:6px;overflow:hidden;font-size:14px;font-weight:600}
.po i{position:absolute;left:0;top:0;bottom:0;background:var(--bg3)}.po.me i{background:var(--acc)}
.po span,.po b{position:relative}
.qhid{display:flex;align-items:center;gap:8px;padding:14px;margin:12px 0;border-radius:14px;background:var(--bg2);font-size:13.5px;color:var(--ink3)}
.fab{position:absolute;right:18px;bottom:104px;width:58px;height:58px;border-radius:29px;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(0,0,0,.2);z-index:6}
.qe{width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.qop{background:var(--ink);color:var(--bg);font-size:11px;font-weight:800;letter-spacing:.02em}
.qc{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.qc .qt{font-size:15px;margin-top:2px}
.qrm{font-size:14px;color:var(--ink3);font-style:italic;margin-top:4px}
.warnb{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--amberbg);font-size:13.5px;line-height:1.4;color:var(--ink)}
.warnb>.ic{color:var(--amber);margin-top:1px}
mark.nm{background:var(--amberbg);color:var(--amber);border-radius:4px;padding:0 2px;font-weight:600;box-shadow:inset 0 -2px 0 var(--amber)}
.karma{text-align:center;padding:18px 0 6px}
.karma b{display:block;font-size:56px;font-weight:800;letter-spacing:-.05em;line-height:1}
/* launch animation on the board */
@keyframes lmIn{0%{transform:scale(.55);opacity:0}14%{transform:scale(1.08);opacity:1}20%{transform:scale(1)}100%{transform:scale(1)}}
@keyframes wmIn{0%,10%{transform:translateY(14px);opacity:0}24%{transform:translateY(0);opacity:1}100%{opacity:1}}
.launchanim .lm{animation:lmIn 3.2s cubic-bezier(.2,.9,.25,1.2) infinite}
.launchanim .wmk{animation:wmIn 3.2s cubic-bezier(.2,.8,.2,1) infinite}

<script>
/* ---- nav update: Quad becomes a tab, search moves into the Discover header ---- */
function tb(a){const t=[['cards','Discover'],['quad','Quad'],['plussq','Sell'],['chat','Inbox'],['user','Profile']];return `<div class="tb">${t.map(([i,l])=>`<div class="${l===a?'on':''}">${ic(i,25)}${l}${l==='Inbox'?'<span class="bdg">2</span>':''}</div>`).join('')}</div>`}
function dhead(m){return `<div class="dh"><div class="campus">Ohio State ${ic('down',16,'b')}</div><div class="sg" style="width:140px"><div class="${m==='swipe'?'on':''}">Swipe</div><div class="${m==='feed'?'on':''}">Campus</div></div><div style="display:flex;margin-right:-4px"><div class="ib" style="width:36px">${ic('search',22)}</div><div class="ib" style="width:36px">${ic('sliders',22)}</div></div></div>`}

</script>
