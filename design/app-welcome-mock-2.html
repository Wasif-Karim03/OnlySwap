<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OnlySwap app welcome: campus wall variations</title>
<style>
:root{--ink:#111110;--ink2:#5c5c55;--ink3:#8e8e86;--line:#e2e2dc;--soft:#f4f4f0;--soft2:#ebebe5;--lime50:#f4f9e4;--lime100:#e6f1c4;--peach:#ffe9d9;--lilac:#ece7ff;--sky:#e2f0ff;--butter:#fff3c9;--acc:#c8e27d;--accdeep:#9fbf3f;--ease:cubic-bezier(.2,.7,.2,1);
--font:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:#e9e9e3;color:var(--ink);-webkit-font-smoothing:antialiased;padding:40px 24px 80px}
.top{max-width:1300px;margin:0 auto 34px}.top h1{font-size:28px;letter-spacing:-.02em}.top p{color:var(--ink2);margin-top:6px;max-width:780px;line-height:1.5}
.row{display:flex;gap:36px 32px;justify-content:center;flex-wrap:wrap;max-width:1400px;margin:0 auto}
.col{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:26px}
.lab{font-weight:700;font-size:15px}.lab span{display:inline-block;background:var(--ink);color:#fff;border-radius:6px;padding:2px 8px;margin-right:8px;font-size:13px}
.note{font-size:13px;color:var(--ink2);max-width:360px;text-align:center;line-height:1.45}
.phone{width:393px;height:852px;border-radius:54px;position:relative;overflow:hidden;box-shadow:0 0 0 11px #1a1a19,0 30px 60px rgba(0,0,0,.25);background:var(--ink);color:#fff}
.phone.light{background:var(--soft);color:var(--ink)}
.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:0 34px 0 40px;font-weight:600;font-size:16px;z-index:30}
.sb i{display:block;width:26px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative}.sb i:after{content:'';position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1.5px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:31}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:138px;height:5px;border-radius:3px;background:currentColor;z-index:30}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.02em;position:absolute;top:62px;left:24px;z-index:12}
.mark{width:26px;height:26px}
.btn{display:flex;align-items:center;justify-content:center;height:54px;border-radius:16px;background:var(--acc);color:var(--ink);font-weight:700;font-size:17px;border:0;width:100%}
.btn.dark{background:var(--ink);color:#fff}
.link{display:flex;align-items:center;justify-content:center;height:48px;font-weight:600;font-size:16px;color:inherit;background:none;border:0;width:100%}
h2.disp{font-size:34px;line-height:1.06;letter-spacing:-.035em;font-weight:800}
.sub{font-size:16px;line-height:1.45;margin-top:10px;opacity:.72}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:0 24px 34px;z-index:12;display:flex;flex-direction:column}
/* wall */
.wall{position:absolute;display:flex;gap:10px;padding:0 10px;overflow:hidden}
.lane{flex:1;display:flex;flex-direction:column;gap:10px;animation:up 40s linear infinite}
.lane:nth-child(2){animation-duration:48s;margin-top:-120px}.lane:nth-child(3){animation-duration:44s;margin-top:-60px}
.lane.down{animation-name:down}
@keyframes up{from{transform:translateY(0)}to{transform:translateY(-50%)}}
@keyframes down{from{transform:translateY(-50%)}to{transform:translateY(0)}}
.tile{border-radius:18px;overflow:hidden;position:relative;flex:none;background:var(--soft2)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:8px;bottom:8px;background:#fff;color:var(--ink);border-radius:9px;padding:4px 7px;font-weight:800;font-size:13px}
.tile.c{display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font-weight:700;font-size:14px;line-height:1.25;color:var(--ink)}
.tile .sold{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(17,17,16,.45);opacity:0;transition:opacity .4s}
.tile .sold b{background:var(--acc);color:var(--ink);border-radius:10px;padding:6px 12px;font-weight:900;font-size:14px;transform:rotate(-8deg)}
.tile.is-sold .sold{opacity:1}
/* rows (H) */
.rows{position:absolute;left:0;right:0;display:flex;flex-direction:column;gap:10px}
.rowx{display:flex;gap:10px;width:max-content;animation:left 50s linear infinite}
.rowx.r2{animation-direction:reverse;animation-duration:58s}
.rowx .tile{width:124px;height:136px}
@keyframes left{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.stats{display:flex;gap:8px;margin-top:16px}
.stats div{border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px 10px;font-size:12px;opacity:.85;flex:1}
.light .stats div{border-color:var(--line)}
.stats b{display:block;font-size:15px}
.spacer{flex:1}
.fade-t{position:absolute;left:0;right:0;top:0;z-index:10}
.fade-b{position:absolute;left:0;right:0;z-index:10}
@media (prefers-reduced-motion:reduce){.lane,.rowx{animation:none}}
</style></head><body>
<div class="top"><h1>Campus wall: six more takes on B</h1>
<p>All keep B's idea, a moving wall of real listings from your school. They differ in color, layout and what moves. B1 is the one you picked, for comparison. Tell me a letter, or mix (for example "B3 layout with B2 colors").</p></div>

const MARK='<svg class="mark" viewBox="0 0 26 26"><path d="M11.5 1.6A11.5 11.5 0 0 0 11.5 24.4Z" fill="#c8e27d"/><path d="M14.5 1.6A11.5 11.5 0 0 1 14.5 24.4Z" fill="#c8e27d"/></svg>';
const ITEMS=[['headphones','$45'],['bike','$120'],['textbooks','$30'],['camera','$60'],['lamp','$8'],['sneakers','$35'],['coffee','$15'],['backpack','$20']];
const TINTS=['var(--lime100)','var(--peach)','var(--lilac)','var(--sky)','var(--butter)'];
const WORDS=['Move-out week is here','Textbooks, half price','Free couch, today only','Bikes are going fast','Dorm stuff under $20'];
const H=[200,150,240,170,210,160];
function lane(off,opts={}){let h='';for(let r=0;r<2;r++)for(let j=0;j<6;j++){const k=(j*3+off)%ITEMS.length;const [img,p]=ITEMS[k];
 if(opts.words!==false&&(j+off)%5===4){h+=`<div class="tile c" style="height:${Math.max(120,H[j]-40)}px;background:${TINTS[(j+off)%5]}">${WORDS[(j+off)%5]}</div>`}
 else h+=`<div class="tile" style="height:${H[(j+off)%6]}px"><img src="${I[img]}" alt=""><span class="tag">${p}</span><div class="sold"><b>${opts.soldWord||'SOLD'}</b></div></div>`}
 return `<div class="lane ${opts.dir&&opts.dir[off]?'down':''}">${h}</div>`}
function wall(style,opts){return `<div class="wall" style="${style}">${lane(0,opts)}${lane(1,opts)}${lane(2,opts)}</div>`}
function rowx(off,cls){let h='';for(let r=0;r<2;r++)for(let j=0;j<8;j++){const [img,p]=ITEMS[(j+off)%8];h+=`<div class="tile"><img src="${I[img]}" alt=""><span class="tag">${p}</span></div>`}return `<div class="rowx ${cls}">${h}</div>`}
const frame=(cls,inner)=>`<div class="phone ${cls}"><div class="island"></div><div class="sb"><b>9:41</b><i></i></div>${inner}<div class="home"></div></div>`;
const btns=(dark)=>`<button class="btn ${dark?'dark':''}">Continue with school email</button><button class="link">I already have an account</button>`;
