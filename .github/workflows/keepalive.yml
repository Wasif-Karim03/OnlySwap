# Keeps the staging project from pausing before launch (P14-KEEP-01; Supabase
# Free pauses after 7 days without activity). Calls the `health` function,
# which runs `select 1`. Delete this file after launch if prod gets daily traffic.
#
# Variable (repository → Settings → Secrets and variables → Actions → Variables):
#   STAGING_FUNCTIONS_URL  https://<staging-ref>.supabase.co/functions/v1
name: Keepalive

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping staging
        run: |
          test -n "${{ vars.STAGING_FUNCTIONS_URL }}" || { echo "STAGING_FUNCTIONS_URL is not set"; exit 1; }
          curl -fsS --retry 3 --retry-delay 10 "${{ vars.STAGING_FUNCTIONS_URL }}/health"
