<script>
/* ================= RENDER ================= */
const SECS={S:['System','Tokens, type and components everything else is built from.'],K:['Checklist','The gap list from the audit, and where each item now lives.'],L:['Logo','Six directions for the mark. Pick one and it updates across the whole file.'],M:['Motion','The launch animation, every micro-interaction playing live, and a phone you can tap through with real transitions.'],A:['Sign up and onboarding','From first open to the first swipe. School email is the only gate.'],B:['Discover and buy','The swipe deck, listing page, offers, search and saved items.'],C:['Campus feed','Activity from listings plus free food and wanted posts. Gives people a reason to open the app when there\'s nothing new to swipe.'],Q:['The Quad','An anonymous board for campus, Yik Yak style. Posts and replies only, no anonymous DMs, because Apple now removes random or anonymous chat apps.'],D:['Sell','Three steps from photos to posted.'],E:['Offers and messages','Offer first, chat only after the seller accepts. Meetup, mark sold, rating, report.'],F:['Profile and settings','Your stuff, your stats, safety, and the account controls the stores require.'],X:['States and details','The screens most apps forget: login, errors, loading, offline, empty, permissions, blocked, suspended, update, help. The difference between a mockup and a real app.'],N:['Other devices and languages','Android, iPad, and what a second language looks like.'],W:['Web','The website and what a shared link looks like outside the app. Your first brief was iOS, Android and web, and this is the web half.'],T:['App Store','Everything the store submission needs: screenshots, the product page, the icon in every size, and the code email students receive.'],G:['Admin panel · web','What you see as the one person running this.'],H:['Handoff','What a developer needs besides the screens: the flow map, tokens, component states, copy rules, every notification, analytics events and the store privacy answers.']};
const board=document.getElementById('board');let html='';
Object.keys(SECS).forEach(k=>{const items=S.filter(s=>s.sec===k);if(!items.length)return;
html+=`<section class="sec" id="sec-${k}"><div class="sec-h"><span class="l">${k}</span><h2>${SECS[k][0]}</h2><p>${SECS[k][1]}</p></div><div class="row">`;
items.forEach((s,i)=>{const code=(k==='S'||k==='L'||k==='M'||k==='K')?'':k+(i+1);const inner=s.o.w?s.html:`<div class="ph ${s.o.andr?'andr':''}">${s.html}<div class="hi ${s.o.hi||''}"></div></div>`;
html+=`<div class="fr ${s.o.w?'w':''}"><div class="cap"><b>${code}</b><span>${s.name}</span></div>${inner}<div class="note" style="max-width:${s.o.w?'720px':'375px'}">${s.note}</div></div>`});
html+=`</div></section>`});
board.innerHTML=html;
document.getElementById('jump').innerHTML=Object.keys(SECS).map(k=>`<a href="#sec-${k}">${({S:'System',L:'Logo',M:'Motion',A:'A · Sign up',B:'B · Buy',C:'C · Campus',Q:'Q · Quad',D:'D · Sell',E:'E · Offers',F:'F · Profile',X:'X · States',K:'Checklist',N:'N · Devices',W:'W · Web',T:'T · Store',G:'G · Admin',H:'H · Handoff'})[k]}</a>`).join('');
document.querySelectorAll('#theme button').forEach(b=>b.onclick=()=>{document.body.dataset.theme=b.dataset.t;document.querySelectorAll('#theme button').forEach(x=>x.classList.toggle('on',x===b))});
document.querySelectorAll('#zoom button').forEach(b=>b.onclick=()=>{board.style.zoom=b.dataset.z;document.querySelectorAll('#zoom button').forEach(x=>x.classList.toggle('on',x===b))});
</script>
