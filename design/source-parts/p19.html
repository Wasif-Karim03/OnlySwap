<style>
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.conf i{position:absolute;width:9px;height:14px;border-radius:2px}
@keyframes cfall{0%{transform:translateY(-40px) rotate(0)}100%{transform:translateY(860px) rotate(540deg)}}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.themes>div{border-radius:16px;border:1.5px solid var(--line);padding:8px;text-align:center;font-size:13px;font-weight:650}
.themes>div.on{border-color:var(--ink);box-shadow:0 0 0 3px var(--acc)}
.tp{height:92px;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.tp i{height:9px;border-radius:5px}
.icg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.icg>div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2)}
.icg .on .lm{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)!important}
</style>
<script>
/* ===== 11. Quad extras ===== */
addAfter('Q','Quad · new','Quad photo','Tap a photo post to see it full screen. Votes and replies stay at the bottom, and there\'s still no name anywhere.',
`<div class="scr" style="background:#000;color:#fff">${sb()}<div class="nv"><div class="ib" style="margin-left:-8px">${ic('x',24)}</div><div class="tt" style="color:#fff">6m · Anonymous</div><div class="ib">${ic('more',22)}</div></div>
<div style="flex:1;display:flex;align-items:center"><div class="im" style="width:100%;height:500px;${I('camp',900)}"></div></div>
<div style="padding:0 20px 44px"><div style="font-size:16px;line-height:1.4">The Oval right now. Nobody is studying today.</div>
<div style="display:flex;gap:18px;align-items:center;margin-top:14px;font-weight:700"><span style="display:flex;gap:6px;align-items:center;background:var(--acc);color:var(--onacc);padding:6px 12px;border-radius:12px">${ic('chup',20,'b')} 38</span><span style="opacity:.8">${ic('chdn',22,'b')}</span><span style="display:flex;gap:6px;align-items:center;opacity:.9;margin-left:auto">${ic('chat',19)} 5 replies</span></div></div></div>`,{hi:'l'});

addAfter('Q','Post','Post options','"Hide this person" works without ever revealing who they are: their posts and replies just stop showing up for you, everywhere on the Quad.',
`<div class="scr">${S.find(s=>s.sec==='Q'&&s.name==='Post').html.replace('<div class="scr">','').replace(/<\/div>$/,'')}<div class="scrim"></div><div class="sh"><div class="grab"></div>
<div class="grp" style="background:var(--bg2)">${[['eye','Hide posts from this person','You won\'t see their posts or replies. They won\'t know.'],['bell','Turn off replies for this post',''],['copy','Copy text',''],['share','Share post','Only people at Ohio State can open it']].map(([i,t,s],n)=>`<div class="li" ${n==3?'style="border:0"':''}>${ic(i,20)}<div style="flex:1"><div class="t" style="font-size:15px">${t}</div>${s?`<div class="s" style="font-size:12.5px">${s}</div>`:''}</div></div>`).join('')}</div>
<div class="grp" style="margin-top:10px"><div class="li" style="border:0;color:var(--red)">${ic('flag',20)}<span class="t" style="font-size:15px">Report post</span></div></div>
<div class="btn s" style="margin-top:10px">Cancel</div></div></div>`);

addAfter('Q','Your Quad','Quad activity','Quad notifications in their own place, separate from buying and selling, so a busy thread never buries an offer.',
`<div class="scr">${sb()}${nav('back','Quad activity')}<div class="ct">
<div class="lbl" style="margin-top:6px">Today</div>
${nrow('chup','ac','Your post about Thompson outlets hit <b>200 upvotes</b>','1h')}
${nrow('chat','gy','<b>12 new replies</b> on "Whoever keeps microwaving fish..."','2h')}
${nrow('quad','gy','<b>OP</b> replied to your comment','3h')}
<div class="lbl" style="margin-top:18px">Earlier</div>
${nrow('trend','ac','You passed <b>1,000 karma</b>','Mon')}
${nrow('ban','gy','A reply was removed for naming a student. <u>See why</u>','Sun')}
${nrow('poll','gy','Your poll closed: <b>Buckeye Donuts</b> won with 41%','Sat')}
<div class="rw" style="margin:22px 0 0"><span class="t" style="font-size:15px">Only notify me about my own posts</span><span class="tg on"></span></div></div></div>`);

addAfter('Q','Quad · new','Quad · day one','A brand-new campus Quad. Prompts give people something easy to post first, because nobody wants to be the first voice in an empty room.',
`<div class="scr">${sb()}${qhead('New')}<div class="ct stc" style="padding-top:10px"><div class="emptyart" style="background:var(--acc);color:var(--onacc)">${ic('quad',40)}</div>
<div class="hm" style="margin-top:20px">The Ohio State Quad just opened</div><p class="bd" style="margin-top:6px;max-width:290px">Nobody has posted yet. Start with something easy:</p>
<div style="display:flex;flex-direction:column;gap:8px;width:100%;margin-top:18px">${['Best quiet study spot on campus?','PSA: the RPAC is open late this week','Found a lost ID, where do I turn it in?'].map(t=>`<div class="op" style="border-style:dashed;justify-content:space-between"><span class="t" style="font-size:14.5px">"${t}"</span>${ic('edit',18,'mu')}</div>`).join('')}</div></div>
<div class="fab">${ic('edit',24)}</div>${tb('Quad')}</div>`);

/* ===== 12. campus unlocked ===== */
const CONF=(n=40)=>`<div class="conf">${Array.from({length:n},(_,i)=>`<i style="left:${(i*37)%100}%;top:-20px;background:${['var(--acc)','#111','#FF9A4D','#7CC0FF','#FFA3D1'][i%5]};animation:cfall ${2.4+(i%7)*.35}s ${(i%9)*.25}s linear infinite"></i>`).join('')}</div>`;
addAfter('A','Campus waitlist','Campus unlocked','The day the counter hits 500. Everyone who waited gets this at once, and it leads straight into listing something, because day one needs sellers most.',
`<div class="scr">${CONF()}${sb()}<div class="ct stc" style="position:relative"><div class="okc" style="width:110px;height:110px;border-radius:55px">${ic('check',52,'b')}</div>
<div class="hx" style="margin-top:26px">Ohio State is open.</div>
<p class="bd" style="margin-top:10px;max-width:290px">500 students joined. You were number 488, so you're one of the first people in.</p>
<div class="card" style="margin-top:22px;width:100%;text-align:left;display:flex;gap:12px;align-items:center">${mark(40,'var(--acc)','var(--onacc)')}<div style="flex:1"><div class="t" style="font-size:14.5px">Founding seller spots are open</div><div class="s" style="font-size:12.5px">First 50 sellers get the badge for good</div></div></div></div>
${dock(`<div class="btn p">List something first</div><div class="btn t" style="margin-top:2px">Start swiping</div>`)}</div>`);

/* ===== 13. settings sub-pages (+17 icon picker) ===== */
addAfter('F','Settings','Blocked accounts','Blocking is quiet. Nobody is told, and unblocking is one tap. People hidden on the Quad stay anonymous even here.',
`<div class="scr">${sb()}${nav('back','Blocked')}<div class="ct">
<div class="lbl" style="margin-top:6px">Marketplace</div>
<div class="grp">${[['B','Ben O.','Blocked Sep 24'],['T','Tyler V.','Blocked Aug 30']].map(([i,n,d],k)=>`<div class="li" ${k==1?'style="border:0"':''}>${av(i,AVC[i]||'#ddd',40)}<div style="flex:1"><div class="t" style="font-size:15px">${n}</div><div class="s" style="font-size:12.5px">${d}</div></div><div class="btn s" style="width:auto;height:34px;padding:0 12px;font-size:13.5px;border-radius:10px;background:var(--bg)">Unblock</div></div>`).join('')}</div>
<div class="lbl" style="margin-top:18px">The Quad</div>
<div class="grp"><div class="li" style="border:0"><span class="fic gy" style="background:var(--bg)">${ic('eye',18)}</span><div style="flex:1"><div class="t" style="font-size:15px">2 people hidden</div><div class="s" style="font-size:12.5px">Still anonymous to you</div></div><div class="btn s" style="width:auto;height:34px;padding:0 12px;font-size:13.5px;border-radius:10px;background:var(--bg)">Unhide all</div></div></div>
<p class="mi" style="margin-top:16px;line-height:1.5">Blocked people can't message you, make offers, or see your listings. They're never told.</p></div></div>`);

addAfter('F','Blocked accounts','Appearance','Light, dark or follow the phone. Plus a choice of app icon, which costs almost nothing to build once the logo is picked and people love it.',
`<div class="scr">${sb()}${nav('back','Appearance')}<div class="ct">
<div class="lbl" style="margin-top:6px">Theme</div>
<div class="themes">${[['System',0,'linear-gradient(90deg,#fff 50%,#111 50%)'],['Light',0,'#fff'],['Dark',1,'#111']].map(([n,o,bg])=>`<div class="${o?'on':''}"><div class="tp" style="background:${bg};box-shadow:inset 0 0 0 1px rgba(128,128,128,.25)"><i style="background:var(--acc);width:60%"></i><i style="background:rgba(128,128,128,.4)"></i><i style="background:rgba(128,128,128,.4);width:70%"></i></div>${n}</div>`).join('')}</div>
<div class="lbl" style="margin-top:22px">App icon</div>
<div class="icg">${[['Default','var(--acc)','var(--onacc)',1],['Night','#111','var(--acc)'],['Paper','#fff','#111'],['Mono','#2a2a2c','#e5e5e5']].map(([n,bg,fg,o])=>`<div class="${o?'on':''}">${mark(62,bg,fg).replace('class="lm" style="','class="lm" style="box-shadow:inset 0 0 0 1px rgba(128,128,128,.25);')}${n}</div>`).join('')}</div>
<div class="lbl" style="margin-top:22px">Motion</div>
<div class="grp"><div class="li"><span class="t" style="flex:1;font-size:15px">Reduce motion</span><span class="s">Follows iPhone</span></div><div class="li" style="border:0"><span class="t" style="flex:1;font-size:15px">Haptics</span><span class="tg on"></span></div></div></div></div>`);

addAfter('F','Appearance','Change school','For transfers. Your ratings and swap count come with you, but listings and Quad posts stay behind, since they belong to that campus.',
`<div class="scr">${sb()}${nav('back','Change school')}<div class="ct">
<div class="grp" style="margin-top:6px"><div class="li" style="border:0"><span class="fic gy" style="background:var(--bg)">${ic('building',18)}</span><div style="flex:1"><div class="t" style="font-size:15px">The Ohio State University</div><div class="s" style="font-size:12.5px">wkarim.12@osu.edu · verified</div></div></div></div>
<div class="lbl" style="margin-top:20px">New school email</div><div class="in f">${ic('mail',20,'mu')}<span>wkarim@umich.edu</span><span class="caret" style="margin-left:-6px"></span></div>
<div class="det">${ic('building',18)}<span>University of Michigan</span><span class="tag gy" style="margin-left:auto">Waitlist · 212/500</span></div>
<div class="lbl" style="margin-top:22px">What moves with you</div>
<div class="tips">${[['check','Your ratings and 12 swaps'],['check','Saved searches and settings'],['x','3 active listings (they come down)'],['x','Your Quad posts and karma']].map(([i,t])=>`<div>${ic(i,16,'b').replace('class="ic b"',i=='x'?'class="ic b" style="color:var(--red)"':'class="ic b"')}<span>${t}</span></div>`).join('')}</div></div>
${dock(`<div class="btn p">Send code to new email</div>`)}</div>`);
</script>
