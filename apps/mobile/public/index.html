<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="robots" content="noindex" />
    <title>OnlySwap</title>
    <!-- react-native-web root reset (https://necolas.github.io/react-native-web/docs/setup/#root-element) -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Keyboard focus is always visible (P13-WEB-07, CLAUDE.md rule 10). */
      :focus-visible {
        outline: 2px solid Highlight !important;
        outline-offset: 2px;
      }
      /* Text fields draw their own 2 px ink focus border (Input, the birthday
         field), so the outline would be a second ring (DEC 90). */
      [data-focus-ring='app']:focus-visible {
        outline: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>

  <body>
    <noscript>OnlySwap needs JavaScript. Turn it on and reload the page.</noscript>
    <div id="root"></div>
  </body>
</html>
