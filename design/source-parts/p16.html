<style>
.wf{width:1440px;border-radius:16px;overflow:hidden;background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px rgba(0,0,0,.09),0 30px 70px -30px rgba(0,0,0,.3);font-size:15px;line-height:1.45}
.wf .chrome{height:40px}
.lnav{height:76px;display:flex;align-items:center;gap:34px;padding:0 80px;border-bottom:1px solid var(--line)}
.lnav a{font-size:15px;font-weight:600;color:var(--ink2)}
.lsec{padding:104px 80px}
.lpill{display:inline-flex;align-items:center;gap:9px;padding:8px 14px;border-radius:999px;background:var(--bg2);font-size:14px;font-weight:600}
.lpill i{width:8px;height:8px;border-radius:4px;background:var(--green);box-shadow:0 0 0 4px var(--greenbg)}
.lh1{font-size:78px;font-weight:800;letter-spacing:-.055em;line-height:.98}
.lh2{font-size:52px;font-weight:800;letter-spacing:-.05em;line-height:1.02}
.llead{font-size:20px;line-height:1.5;color:var(--ink2)}
.lform{display:flex;gap:10px;max-width:540px}
.lform .in{flex:1;height:60px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line2);font-size:17px}
.lform .wbtn{height:60px;padding:0 26px;font-size:17px;border-radius:15px}
.ltrust{display:flex;gap:26px;margin-top:30px}
.ltrust div{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;color:var(--ink2)}
.ltrust .ic{color:var(--ink)}
.hart{position:relative;height:640px;border-radius:40px;background:var(--acc);overflow:hidden}
.hart .phwrap{position:absolute;box-shadow:0 40px 80px -20px rgba(0,0,0,.45)}
.fcard{position:absolute;background:var(--bg);color:var(--ink);border-radius:18px;box-shadow:0 20px 40px -12px rgba(0,0,0,.35);padding:12px 14px;display:flex;gap:11px;align-items:center;font-size:13.5px;z-index:4}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.mtrack{display:flex;gap:18px;width:max-content;animation:marq 48s linear infinite}
.mcard{width:220px;flex:none}
.mcard .im{height:220px;border-radius:20px;position:relative}
.mcard .gp{font-size:18px}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:56px}
.st3{background:var(--bg2);border-radius:32px;overflow:hidden;display:flex;flex-direction:column}
.st3 .tx{padding:32px 32px 0}
.st3 .n{width:40px;height:40px;border-radius:20px;background:var(--ink);color:var(--bg);font-weight:800;display:flex;align-items:center;justify-content:center}
.st3 h3{font-size:26px;font-weight:800;letter-spacing:-.035em;margin-top:20px}
.st3 p{font-size:16px;color:var(--ink2);margin-top:8px;line-height:1.5}
.st3 .crop{height:380px;position:relative;margin-top:32px;display:flex;justify-content:center}
.st3 .crop .phwrap{position:absolute;top:0;border-radius:36px 36px 0 0}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:28px;overflow:hidden;margin-top:56px}
.feat>div{background:var(--bg);padding:34px}
.feat .fi2{width:48px;height:48px;border-radius:14px;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center}
.feat h4{font-size:20px;font-weight:750;letter-spacing:-.025em;margin-top:22px}
.feat p{font-size:15.5px;color:var(--ink2);margin-top:6px;line-height:1.5}
.dark{background:#0F0F10;color:#F3F3EF;--ink2:#A6A69F}
.chk{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:17px}
.chk .ic{color:var(--acc);margin-top:2px}
.camp{border:1px solid var(--line);border-radius:22px;padding:22px}
.faq{border-bottom:1px solid var(--line);padding:22px 0}
.faq .q{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:700;letter-spacing:-.02em}
.faq p{font-size:16px;color:var(--ink2);margin-top:10px;line-height:1.55;max-width:620px}
.cta{border-radius:40px;background:var(--acc);color:var(--onacc);padding:72px;display:flex;justify-content:space-between;align-items:center;gap:40px}
.lfoot{padding:64px 80px 40px;border-top:1px solid var(--line);display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1fr;gap:30px}
.lfoot h5{font-size:13px;font-weight:700;color:var(--ink3);margin-bottom:14px}
.lfoot a{display:block;font-size:15px;color:var(--ink2);margin-bottom:10px;font-weight:500}
.lbot{padding:22px 80px 34px;display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink3);border-top:1px solid var(--line)}
/* mobile landing */
.mweb{width:390px;border-radius:40px;overflow:hidden;background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px rgba(0,0,0,.09),0 30px 60px -24px rgba(0,0,0,.28);font-size:15px;line-height:1.45}
.mnav{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line)}
.msec{padding:44px 22px}
</style>
<script>
/* remove the first-draft web screens, keep the phone shared-listing one */
for(let i=S.length-1;i>=0;i--){if(S[i].sec==='W'&&['Campus landing page','Shared listing · desktop','Browse on desktop'].includes(S[i].name))S.splice(i,1)}
function wf(url,body){return `<div class="th wf"><div class="chrome"><i></i><i></i><i></i><div class="url">${ic('lock',12)} ${url}</div></div>${body}</div>`}
const WL=(s=36)=>`<div class="wlogo" style="font-size:${Math.round(s*.66)}px">${mark(s,'var(--acc)','var(--onacc)')}onlyswap</div>`;
const LIST=[['fridge','$40','Mini fridge, 3.1 cu ft','Baker Hall · 12m'],['lamp','$12','Desk lamp, black','Lincoln Tower · 2h'],['pods','$85','AirPods Pro','RPAC · 1h'],['sw','$180','Switch + 2 games','Morrill · 3h'],['books','$25','CHEM 1210 bundle','Thompson · 6h'],['chair','$30','Desk chair, grey','Morrill · 5h'],['bike','$120','Trek city bike','Off campus · 1d'],['gtr','$140','Squier Strat','Baker Hall · 1d'],['mir','Free','Floor mirror','Morrill · 2h'],['shoe','$55','AF1, size 10','Lincoln Tower · 4h']];
function mcard(k,p,t,m){return `<div class="mcard"><div class="im" style="${I(k,440)}">${p==='Free'?'<span class="tag ac pt2">Free</span>':''}</div><div class="gp">${p}</div><div class="gt" style="font-size:15px">${t}</div><div class="gm">${m}</div></div>`}
const FAQ=[['Is it free?','Yes. Listing, offering and chatting are free. You pay each other in person, and OnlySwap never touches the money.',1],['Who can join?','Current students with a school email. We re-check once a year, so alumni and staff don\'t end up on a students-only app.'],['How do meetups work?','Once the seller accepts your offer, you pick a time and a safe-exchange spot on campus in the chat. Check the item, pay, done.'],['What can\'t I sell?','Alcohol, vapes, meds, weapons, tickets, meal swipes and coursework. The full list is on the banned items page.'],['Is the Quad really anonymous?','To other students, yes. We keep your account on file and only share it if the law requires it or someone is in danger.'],['My school isn\'t on the list','Join with your school email anyway. Every campus opens once 500 students sign up.']];
const CAMPS=[['Ohio State','Live · 214 listings',100,1],['Michigan','212 / 500 joined',42],['Penn State','97 / 500 joined',19],['Purdue','64 / 500 joined',13],['Indiana','51 / 500 joined',10],['Wisconsin','38 / 500 joined',8]];

add('W','Landing page','The full onlyswap.app page, top to bottom. Every section answers one question a student has: what is it, is anything actually on it, how does it work, is it safe, is my school open. The footer carries the "not affiliated with any university" line, which you need legally.',
wf('onlyswap.app',`
<div class="lnav">${WL()}<a style="margin-left:24px">How it works</a><a>Safety</a><a>The Quad</a><a>Campuses</a><div style="margin-left:auto;display:flex;gap:10px;align-items:center"><a style="color:var(--ink)">Log in</a><div class="wbtn k" style="margin-left:14px">Get the app</div></div></div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:56px;padding:72px 80px 40px;align-items:center">
<div><span class="lpill"><i></i> Live at Ohio State · 214 things for sale right now</span>
<div class="lh1" style="margin-top:26px">Buy and sell with students at your school.</div>
<p class="llead" style="margin-top:24px;max-width:540px">Swipe through what people on your campus are selling. Make an offer, meet at a safe spot between classes, and pay in person. No shipping, no strangers, no fees.</p>
<div class="lform" style="margin-top:34px"><div class="in">${ic('mail',20,'mu')}<span style="color:var(--ink3)">you@school.edu</span></div><div class="wbtn p">Join your campus</div></div>
<div class="mi" style="margin-top:12px;font-size:13.5px">Takes 30 seconds. School emails only.</div>
<div class="ltrust">${[['shield','Verified students only'],['pin','Campus safe spots'],['tag','No fees']].map(([i,t])=>`<div>${ic(i,19)}${t}</div>`).join('')}</div></div>
<div class="hart">
<div style="position:absolute;left:36px;top:96px;transform:rotate(-7deg)">${phmini('Q','Quad',.64)}</div>
<div style="position:absolute;left:250px;top:52px;z-index:2">${phmini('B','Swipe',.72)}</div>
<div class="fcard" style="left:26px;top:36px"><span class="fic ac" style="background:#111;color:var(--acc)">${ic('check',18,'b')}</span><div><b>Devin accepted your offer</b><div class="s" style="font-size:12.5px">Mini fridge · $35 · now</div></div></div>
<div class="fcard" style="right:22px;bottom:34px">${thumb('lamp',44,10)}<div><b>Desk lamp · $12</b><div class="s" style="font-size:12.5px">Lincoln Tower · just listed</div></div></div></div></div>

<div style="padding:40px 0 20px"><div style="display:flex;justify-content:space-between;align-items:baseline;padding:0 80px"><div class="hm" style="font-size:26px">Just listed at Ohio State</div><span class="sm" style="display:flex;gap:6px;align-items:center"><i style="width:8px;height:8px;border-radius:4px;background:var(--green)"></i>Updating live</span></div>
<div style="overflow:hidden;margin-top:24px;padding-left:80px"><div class="mtrack">${[...LIST,...LIST].map(a=>mcard(...a)).join('')}</div></div></div>

<div class="lsec"><div class="lh2" style="max-width:760px">Three steps, and no awkward DMs.</div>
<div class="steps3">${[['1','Swipe','Right to make an offer, left to skip. Or just search when you know what you need.','B','Swipe'],['2','Offer, then chat','The seller sees your offer first. A chat only opens if they say yes.','E','Incoming offer'],['3','Meet and swap','Pick a safe-exchange spot on campus, check the item, pay in person.','E','Meetup day']].map(([n,h,p,s,nm])=>`<div class="st3"><div class="tx"><div class="n">${n}</div><h3>${h}</h3><p>${p}</p></div><div class="crop">${phmini(s,nm,.62)}</div></div>`).join('')}</div></div>

<div class="lsec" style="padding-top:0"><div class="lh2" style="max-width:820px">Built for one campus, not the whole internet.</div>
<div class="feat">${[['building','Only your school','Everyone is verified with a school email, and your feed only shows your campus.'],['chat','No surprise DMs','Buyers send an offer, not a message. You decide who you talk to.'],['pin','Safe spots built in','Every listing shows a campus safe-exchange zone to meet at.'],['gift','A shelf for free stuff','Moving out? Give things away in two taps instead of leaving them on the curb.'],['trend','Real price hints','See what similar things actually sold for on your campus.'],['quad','The Quad','An anonymous board for campus talk. Posts only, moderated, no DMs.']].map(([i,h,p])=>`<div><div class="fi2">${ic(i,24)}</div><h4>${h}</h4><p>${p}</p></div>`).join('')}</div></div>

<div class="lsec dark" style="display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center">
<div><div class="lh2">Built around the meetup.</div><p class="llead" style="margin-top:20px;max-width:520px">Meeting someone you don't know is the risky part of buying secondhand, so that's where most of the design went.</p>
<div style="margin-top:28px;max-width:540px">${['Real students only, re-checked every year','Sellers accept before any chat opens','A safe-exchange zone on every listing','Share your meetup with a friend in one tap','Report or block from any screen, reviewed by a person'].map(t=>`<div class="chk">${ic('check',20,'b')}<span>${t}</span></div>`).join('')}</div></div>
<div style="position:relative;height:620px"><div style="position:absolute;left:30px;top:10px;transform:rotate(-4deg)">${phmini('E','Meetup day',.72)}</div><div style="position:absolute;right:10px;top:70px;transform:rotate(5deg)">${phmini('E','Share with a friend',.66)}</div></div></div>

<div class="lsec" style="background:var(--bg2);display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center">
<div style="position:relative;height:620px;display:flex;justify-content:center"><div style="position:absolute;top:10px">${phmini('Q','Quad',.74)}</div></div>
<div><span class="lpill" style="background:var(--bg)">${ic('lock',15)} Anonymous to students, not to us</span><div class="lh2" style="margin-top:22px">And for everything else, the Quad.</div>
<p class="llead" style="margin-top:20px;max-width:520px">Found a Hydro Flask, need a quiet study spot, want to complain about whoever microwaves fish at 2am. Post it to your campus without your name on it.</p>
<p class="sm" style="margin-top:18px;max-width:500px;font-size:15px">No names of students, no phone numbers, no DMs. Posts that drop to -5 disappear, and a person reviews every report.</p></div></div>

<div class="lsec" style="text-align:center"><div class="lh2">Is your school open yet?</div><p class="llead" style="margin-top:14px">Every campus opens once 500 students join.</p>
<div class="in" style="max-width:520px;margin:28px auto 0;height:60px;font-size:17px">${ic('search',20,'mu')}<span style="color:var(--ink3)">Search for your school</span></div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px;text-align:left">${CAMPS.map(([n,s,p,live])=>`<div class="camp"><div class="rw" style="margin:0"><span class="hs" style="font-size:19px">${n}</span>${live?'<span class="tag gn">Open</span>':'<span class="tag gy">Waitlist</span>'}</div><div class="bar" style="margin-top:16px;height:8px"><i style="width:${p}%;${live?'background:var(--green)':''}"></i></div><div class="rw" style="margin:12px 0 0"><span class="sm">${s}</span><span class="sm" style="font-weight:700;color:var(--ink)">${live?'Browse':'Join waitlist'} ${ic('chev',14,'b').replace('class="ic b"','class="ic b" style="display:inline;vertical-align:-2px"')}</span></div></div>`).join('')}</div>
<div class="mi" style="margin-top:16px">Campus list shown as an example.</div></div>

<div class="lsec" style="padding-top:0;display:grid;grid-template-columns:1fr 1.6fr;gap:64px"><div class="lh2">Questions</div>
<div>${FAQ.map(([q,a,o])=>`<div class="faq"><div class="q">${q}<span style="color:var(--ink3)">${ic(o?'minus':'plus',22)}</span></div>${o?`<p>${a}</p>`:''}</div>`).join('')}</div></div>

<div style="padding:0 80px 104px"><div class="cta"><div><div class="lh2" style="font-size:48px;max-width:640px">Someone on your campus is selling exactly what you need.</div></div>
<div style="width:460px;flex:none"><div class="lform"><div class="in" style="box-shadow:none">${ic('mail',20,'mu')}<span style="color:var(--ink3)">you@school.edu</span></div><div class="wbtn k" style="height:60px;border-radius:15px;padding:0 22px;font-size:17px">Join</div></div>${STORES}</div></div></div>

<div class="lfoot"><div>${WL(32)}<p class="sm" style="margin-top:14px;max-width:260px;font-size:14.5px">The marketplace for students at your school.</p></div>
${[['Product',['How it works','The Quad','Campuses','Get the app']],['Safety',['Safety center','Community rules','Banned items','Report a problem']],['Company',['About','For schools','Contact']],['Legal',['Terms','Privacy','Cookie settings']]].map(([h,l])=>`<div><h5>${h}</h5>${l.map(x=>`<a>${x}</a>`).join('')}</div>`).join('')}</div>
<div class="lbot"><span>© 2026 OnlySwap. Not affiliated with or endorsed by any university.</span><span>help@onlyswap.app</span></div>`),{w:1});

add('W','Landing page · phone','The same page on a phone, where most students will actually see it first, usually from a link in a group chat. Same sections, stacked, with the email form above the fold.',
`<div class="th mweb">${sb()}<div class="mnav">${WL(30)}<div style="display:flex;gap:8px;align-items:center"><div class="wbtn k" style="height:36px;padding:0 14px;font-size:14px;border-radius:10px">Get the app</div>${ic('list',24)}</div></div>
<div class="msec" style="padding-top:30px"><span class="lpill" style="font-size:12.5px"><i></i> Live at Ohio State · 214 for sale</span>
<div class="lh1" style="font-size:44px;margin-top:18px">Buy and sell with students at your school.</div>
<p class="bd" style="margin-top:14px;font-size:16px">Swipe, make an offer, meet at a safe spot on campus. No shipping, no strangers, no fees.</p>
<div class="in" style="margin-top:22px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line2)">${ic('mail',20,'mu')}<span style="color:var(--ink3)">you@school.edu</span></div><div class="btn p" style="margin-top:10px">Join your campus</div>
<div class="hart" style="height:430px;margin-top:30px;border-radius:30px"><div style="position:absolute;left:62px;top:36px">${phmini('B','Swipe',.62)}</div></div></div>
<div style="padding:0 0 20px 22px"><div class="hs">Just listed at Ohio State</div><div style="display:flex;gap:12px;margin-top:14px;overflow:hidden">${LIST.slice(0,3).map(a=>`<div style="width:150px;flex:none"><div class="im" style="height:150px;border-radius:16px;${I(a[0],300)}"></div><div class="gp">${a[1]}</div><div class="gt">${a[2]}</div></div>`).join('')}</div></div>
<div class="msec">${[['1','Swipe','Right to make an offer, left to skip.'],['2','Offer, then chat','A chat only opens if the seller says yes.'],['3','Meet and swap','At a safe-exchange spot on campus.']].map(([n,h,p])=>`<div style="display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)"><div class="n" style="width:34px;height:34px;border-radius:17px;background:var(--ink);color:var(--bg);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none">${n}</div><div><div class="hs">${h}</div><div class="s" style="margin-top:2px">${p}</div></div></div>`).join('')}</div>
<div class="msec dark"><div class="lh2" style="font-size:34px">Built around the meetup.</div>${['Real students only','Sellers accept before chat opens','Safe spots on every listing','Share your meetup with a friend'].map(t=>`<div class="chk" style="font-size:15.5px">${ic('check',18,'b')}<span>${t}</span></div>`).join('')}</div>
<div class="msec"><div class="cta" style="padding:32px 24px;border-radius:28px;display:block"><div class="lh2" style="font-size:30px">Your campus is already selling.</div><div class="btn k" style="margin-top:20px">Join with your school email</div></div></div>
<div style="padding:10px 22px 40px;font-size:12.5px;color:var(--ink3);line-height:1.6">Terms · Privacy · Community rules · Safety<br>© 2026 OnlySwap. Not affiliated with or endorsed by any university.</div></div>`,{w:1});
</script>
