# E2E-06 The seller accepts and chat opens (the Demo University bot is the
# seller; it accepts after about 30 s and answers one message).
appId: app.onlyswap
tags: [offers, chat, reviewer, two-party]
---
- runFlow: ../subflows/reviewer.yaml
- swipe:
    direction: RIGHT
    duration: 300
- tapOn:
    id: offer-send
- tapOn: Done
- tapOn: Inbox
- extendedWaitUntil:
    visible:
      id: 'inbox-chat-.*'
    timeout: 120000
- tapOn:
    id: 'inbox-chat-.*'
    index: 0
- assertVisible:
    id: screen-chat
- tapOn:
    id: chat-input
- inputText: hi
- tapOn:
    id: chat-send
- assertVisible: hi
# The bot answers through realtime.
- extendedWaitUntil:
    visible:
      id: 'msg-.*'
      index: 2
    timeout: 90000
