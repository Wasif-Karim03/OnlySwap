# Media Worker (P5-MEDIA-01). Serves public images from R2 (DATA_MODEL §6).
# Deploy: `npx wrangler deploy -c workers/media/wrangler.toml` (staging: `--env staging`).
name = "onlyswap-media"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true
# Chat photos (R1.1) need the signing secret, the same value as the Vault
# secret media_signing_key: `npx wrangler secret put MEDIA_SIGNING_KEY` (and --env staging).

# Photo screening (DEC 152): Workers AI through the binding, no API token.
# Secret: `npx wrangler secret put SCAN_KEY` (same value as the Edge Function's).
[ai]
binding = "AI"

# WebP photos are turned into a small JPEG before Workers AI looks at them
# (DEC 152 follow-up): the vision model could not read WebP. Free plan:
# 5,000 unique transformations a month; past that the original is sent.
[images]
binding = "IMAGES"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "onlyswap-media"
preview_bucket_name = "onlyswap-media-staging"

[env.staging]
name = "onlyswap-media-staging"

[env.staging.ai]
binding = "AI"

[env.staging.images]
binding = "IMAGES"

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "onlyswap-media-staging"
