<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your OnlySwap code</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    "
  >
    <p style="margin: 0 0 16px; font-size: 16px">Here is your OnlySwap code:</p>
    <p style="margin: 0 0 16px; font-size: 32px; font-weight: 600; letter-spacing: 6px">
      {{ .Token }}
    </p>
    <p style="margin: 0 0 16px; font-size: 16px">Enter it in the app. It works for 10 minutes.</p>
    <p style="margin: 0; font-size: 14px">
      Didn't ask for this? You can ignore this email. Nobody can sign in without the code.
    </p>
  </body>
</html>
